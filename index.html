          <td><input class="input" type="number" step="0.01" min="0" data-i="${i}" data-f="cost" value="${l.cost}" style="width:100px;padding:6px 8px"></td>
          <td style="text-align:right;font-weight:600">${rs(l.total)}</td>
          <td><button type="button" class="btn btn-ghost btn-sm" data-del="${i}" style="color:var(--red)">✕</button></td>
        </tr>`).join('')}</tbody>
      </table></div>`;

      box.querySelectorAll('input[data-i]').forEach(inp=>{
        inp.oninput = e => {
          const i = +e.target.dataset.i;
          const f = e.target.dataset.f;
          billLines[i][f] = Number(e.target.value)||0;
          billLines[i].total = billLines[i].qty * billLines[i].cost;
          renderBillLines();
        };
      });
      box.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = ()=>{ billLines.splice(+btn.dataset.del, 1); renderBillLines(); };
      });
      updateBillSummary();
    }

    function updateBillSummary(){
      const sub = billLines.reduce((sum,l)=>sum+(Number(l.total)||0), 0);
      const disc = Number(root.querySelector('#bf-disc').value)||0;
      const total = Math.max(0, sub - disc);
      const box = root.querySelector('#bf-summary');
      if(box) box.innerHTML = `
        <div style="display:flex;justify-content:space-between"><span>Subtotal</span><b>${rs(sub)}</b></div>
        <div style="display:flex;justify-content:space-between"><span>Discount</span><b>− ${rs(disc)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:15px;padding-top:6px;border-top:1px solid var(--border)"><b>Total</b><b>${rs(total)}</b></div>
      `;
    }

    /* ---- Mount product search-select ---- */
    const prodSS = root.querySelector('#bf-prod-ss');
    mountSearchSelect(prodSS, {
      items: DB.products.map(productToOption),
      allowAdd: true,
      onAdd: () => openQuickProductForm(p => {
        billLines.push({
          product_id: p.id,
          product_name: p.name,
          unit: p.dual ? p.base_unit : p.unit,
          qty: 1,
          cost: Number(p.cost)||0,
          total: Number(p.cost)||0
        });
        renderBillLines();
      }),
      onSelect: opt => {
        if(!opt) return;
        const p = DB.products.find(x=>x.id===opt.id);
        if(!p) return;
        billLines.push({
          product_id: p.id,
          product_name: p.name,
          unit: p.dual ? p.base_unit : p.unit,
          qty: 1,
          cost: Number(p.cost)||0,
          total: Number(p.cost)||0
        });
        renderBillLines();
        setTimeout(()=>prodSS.reset(), 50);
      }
    });

    renderBillLines();
    root.querySelector('#bf-disc').oninput = updateBillSummary;

    /* ---- Submit ---- */
    root.querySelector('#bf').onsubmit = async e => {
      e.preventDefault();
      const dt = readDateTime(e.target); if(!dt) return;
      if(!billLines.length){ toast('Add at least one item','error'); return; }
      for(const l of billLines){
        if(!(Number(l.qty) > 0)){ toast('Qty must be > 0 for ' + l.product_name,'error'); return; }
        if(Number(l.cost) < 0){ toast('Cost cannot be negative for ' + l.product_name,'error'); return; }
      }

      const fd = new FormData(e.target);
      const sub = billLines.reduce((s,l)=>s+(Number(l.total)||0), 0);
      const disc = Number(fd.get('discount'))||0;
      const total = Math.max(0, sub - disc);
      const paid = Number(fd.get('paid'))||0;

      const data = {
        supplier_id: s.id,
        bill_no: fd.get('bill_no')||'',
        bill_date: dt.date,
        tx_time: dt.time,
        subtotal: sub,
        discount: disc,
        total, paid,
        notes: fd.get('notes')||''
      };

      const btn = root.querySelector('#bf-save');
      btn.disabled = true; btn.textContent = 'Saving...';

      if(existing){
        /* 1) Update bill header */
        const upd = await sb.from('supplier_invoices').update(data).eq('id', existing.id).select().single();
        if(upd.error){ toast(upd.error.message,'error'); btn.disabled = false; btn.textContent = 'Update'; return; }

        /* 2) Reverse old stock safely */
        const oldItems = DB.supplier_invoice_items.filter(x=>x.supplier_invoice_id === existing.id);
        for(const oi of oldItems){
          await adjustStock(oi.product_id, -Number(oi.qty));
        }

        /* 3) Delete old items, insert new */
        await sb.from('supplier_invoice_items').delete().eq('supplier_invoice_id', existing.id);
        await sb.from('supplier_invoice_items').insert(billLines.map(l=>({
          supplier_invoice_id: existing.id,
          product_id: l.product_id,
          product_name: l.product_name,
          unit: l.unit,
          qty: l.qty,
          cost: l.cost,
          total: l.total
        })));

        /* 4) Apply new stock safely */
        for(const l of billLines){
          await adjustStock(l.product_id, Number(l.qty));
        }
      } else {
        /* 1) Insert bill header */
        const ins = await sb.from('supplier_invoices').insert(data).select().single();
        if(ins.error){ toast(ins.error.message,'error'); btn.disabled = false; btn.textContent = 'Save'; return; }
        const bill = ins.data;

        /* 2) Insert items */
        await sb.from('supplier_invoice_items').insert(billLines.map(l=>({
          supplier_invoice_id: bill.id,
          product_id: l.product_id,
          product_name: l.product_name,
          unit: l.unit,
          qty: l.qty,
          cost: l.cost,
          total: l.total
        })));

        /* 3) Add stock safely */
        for(const l of billLines){
          await adjustStock(l.product_id, Number(l.qty));
        }
      }

      await syncDB();
      toast(existing?'Bill updated — stock adjusted':'Bill saved — stock added','success');
      closeModal();
      route();
    };
  });
}
/* ============================================================
   PART 18 — RETURNS (from party + to company)
   ============================================================ */
function renderReturns(content){
  content.innerHTML = `
    <div class="page-head">
      <div><h1>Returns</h1><p>Customer returns &amp; company returns</p></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-primary" id="rt-tab-from">From Party</button>
        <button class="btn btn-ghost" id="rt-tab-to">To Company</button>
      </div>
    </div>
    <div id="rt-content"></div>
    <div class="card" style="margin-top:16px">
      <div class="card-title">Recent returns</div>
      <div id="rt-list"></div>
    </div>
  `;

  /* ---------- Recent returns list ---------- */
  function renderList(){
    const box = $('#rt-list');
    const arr = DB.returns.slice(0, 20);
    box.innerHTML = !arr.length
      ? '<p style="color:var(--text-3);text-align:center;padding:20px 0;font-size:13px">No returns yet</p>'
      : `<div class="tbl-wrap"><table>
          <thead><tr><th>Date</th><th>Direction</th><th>Product</th><th>Qty</th><th style="text-align:right">Amount</th><th>Reason</th><th></th></tr></thead>
          <tbody>${arr.map(r=>{
            const inv = DB.invoices.find(i=>i.id===r.invoice_id);
            const sup = r.supplier_id ? DB.suppliers.find(s=>s.id===r.supplier_id) : null;
            const party = r.party_type === 'retailer'
              ? DB.retailers.find(x=>x.id===r.party_id)
              : DB.farmers.find(x=>x.id===r.party_id);
            const dirLabel = r.direction === 'from_party'
              ? `<span class="chip chip-blue">From ${r.party_type==='retailer'?'Retailer':'Farmer'}</span>`
              : `<span class="chip chip-purple">To Company</span>`;
            const subLabel = r.direction === 'from_party'
              ? (party?.name || '—') + (inv?.invoice_no ? '   ' + inv.invoice_no : '')
              : (sup?.name || '—');
            return `<tr>
              <td style="color:var(--text-2);font-size:12px">${txDT(r,'return_date')}</td>
              <td>${dirLabel}</td>
              <td>${esc(r.product_name||'—')}<div style="font-size:11px;color:var(--text-2)">${esc(subLabel)}</div></td>
              <td>${fmtNum(r.qty)} ${esc(r.unit||'')}</td>
              <td style="text-align:right;color:var(--red);font-weight:600">${rs(r.amount)}</td>
              <td style="color:var(--text-2);font-size:12px">${esc(r.reason||'—')}</td>
              <td style="text-align:right"><button class="btn btn-ghost btn-sm" data-del="${r.id}" style="color:var(--red)">Del</button></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`;

    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const r = DB.returns.find(x=>x.id===b.dataset.del);
      if(!r) return;
      if(!confirmDlg('Delete this return?\n\nStock and balances will be reversed.','Confirm Delete')) return;

      if(r.direction === 'from_party'){
        /* Reverse: stock DOWN, credit note deleted */
        if(r.product_id){
          await adjustStock(r.product_id, -Number(r.base_qty || r.qty || 0));
        }
        /* Remove the auto-generated credit note */
        const credits = DB.invoices.filter(i =>
          i.party_id === r.party_id &&
          i.party_type === r.party_type &&
          String(i.invoice_no||'').startsWith('RET-') &&
          Math.abs(Number(i.total)) === Math.abs(Number(r.amount))
        );
        if(credits.length){
          credits.sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));
          await sb.from('invoices').delete().eq('id', credits[0].id);
        }
      } else if(r.direction === 'to_supplier'){
        /* Reverse: stock UP (put stock back into inventory), remove credit-note payment */
        if(r.product_id){
          await adjustStock(r.product_id, Number(r.base_qty || r.qty || 0));
        }
        const credPay = DB.supplier_payments.filter(p =>
          p.supplier_id === r.supplier_id &&
          p.mode === 'credit-note' &&
          Number(p.amount) === Number(r.amount)
        );
        if(credPay.length){
          credPay.sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));
          await sb.from('supplier_payments').delete().eq('id', credPay[0].id);
        }
      }

      await sb.from('returns').delete().eq('id', r.id);
      await syncDB();
      toast('Return deleted — reversed','success');
      route();
    });
  }

  /* ---------- Return FROM party (farmer/retailer) ---------- */
  function renderFromParty(){
    $('#rt-tab-from').className = 'btn btn-primary';
    $('#rt-tab-to').className = 'btn btn-ghost';
    $('#rt-content').innerHTML = `
      <div class="card">
        <form id="rt-from-form" style="display:flex;flex-direction:column;gap:12px">
          ${dateTimeFieldHTML(null,'','Return Date')}
          <div><label class="label">Invoice</label>${searchSelectHTML('rt-inv-ss','Search invoice...')}</div>
          <div id="rt-from-lines"></div>
          <div id="rt-from-fields" style="display:none;flex-direction:column;gap:12px">
            <div class="grid-3">
              <div><label class="label">Qty</label><input class="input" type="number" step="any" min="0.01" name="qty" value="1" id="rt-qty"></div>
              <div><label class="label">Refund ₹</label><input class="input" type="number" step="0.01" min="0" name="amount" value="0" id="rt-amt"></div>
              <div><label class="label">Reason</label><input class="input" name="reason"></div>
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" id="rt-from-submit" disabled>Record Return</button></div>
        </form>
      </div>
    `;

    let selectedInvoice = null;
    const invSS = $('#rt-inv-ss');
    mountSearchSelect(invSS, {
      items: DB.invoices.map(invoiceToOption),
      onSelect: opt => {
        selectedInvoice = opt ? DB.invoices.find(i => i.id === opt.id) : null;
        renderLinePicker();
      }
    });

    function renderLinePicker(){
      const box = $('#rt-from-lines');
      const fieldsBox = $('#rt-from-fields');
      const submitBtn = $('#rt-from-submit');
      if(!selectedInvoice){
        box.innerHTML=''; fieldsBox.style.display='none'; submitBtn.disabled=true; return;
      }
      const items = DB.invoice_items.filter(i=>i.invoice_id === selectedInvoice.id);
      if(!items.length){
        box.innerHTML = '<p style="color:var(--text-3);font-size:13px">No items on this invoice</p>';
        fieldsBox.style.display='none'; submitBtn.disabled=true; return;
      }
      box.innerHTML = `<label class="label">Select item</label>
        <div class="tbl-wrap"><table>
          <thead><tr><th></th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th></tr></thead>
          <tbody>${items.map(it=>`<tr>
            <td><input type="radio" name="rt-line" value="${it.id}"
              data-pid="${it.product_id||''}"
              data-name="${esc(it.product_name)}"
              data-unit="${esc(it.unit||'')}"
              data-price="${it.price}"
              data-qty="${it.qty}"
              data-pack="${it.pack_size||1}"
              data-punit="${esc(it.pack_unit||'')}"
              data-bunit="${esc(it.base_unit||'')}"></td>
            <td>${esc(productLineLabel(it))}</td>
            <td style="text-align:right">${fmtNum(it.qty)}</td>
            <td style="text-align:right">${rs(it.price)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      fieldsBox.style.display = 'flex';
      submitBtn.disabled = false;
      $('#rt-qty').value = 1;
      $('#rt-amt').value = 0;
      $$('input[name="rt-line"]', box).forEach(r => r.onchange = e => {
        const price = Number(e.target.dataset.price)||0;
        $('#rt-qty').value = 1;
        $('#rt-amt').value = price;
      });
      $('#rt-qty').oninput = e => {
        const r = document.querySelector('input[name="rt-line"]:checked');
        if(!r) return;
        const price = Number(r.dataset.price)||0;
        $('#rt-amt').value = (Number(e.target.value)||0) * price;
      };
    }

    $('#rt-from-form').onsubmit = async e => {
      e.preventDefault();
      if(!selectedInvoice){ toast('Select an invoice','error'); return; }
      const r = document.querySelector('input[name="rt-line"]:checked');
      if(!r){ toast('Select an item','error'); return; }
      const dt = readDateTime(e.target); if(!dt) return;
      const fd = new FormData(e.target);
      const qty = Number(fd.get('qty'))||0;
      const amount = Number(fd.get('amount'))||0;
      if(qty <= 0){ toast('Qty must be > 0','error'); return; }
      if(amount <= 0){ toast('Refund must be > 0','error'); return; }

      const productId = r.dataset.pid;
      const unit = r.dataset.unit;
      const packSize = Number(r.dataset.pack)||1;
      const isPackUnit = r.dataset.punit && unit === r.dataset.punit;
      const baseQty = qty * (isPackUnit ? packSize : 1);

      const btn = $('#rt-from-submit');
      btn.disabled = true; btn.textContent = 'Saving...';

      /* 1) Insert return record */
      const { error } = await sb.from('returns').insert({
        direction: 'from_party',
        invoice_id: selectedInvoice.id,
        party_id: selectedInvoice.party_id,
        party_type: selectedInvoice.party_type,
        product_id: productId,
        product_name: r.dataset.name,
        unit: unit,
        qty, base_qty: baseQty,
        amount,
        reason: fd.get('reason')||'',
        return_date: dt.date,
        tx_time: dt.time
      });
      if(error){
        toast(error.message,'error');
        btn.disabled = false; btn.textContent = 'Record Return';
        return;
      }

      /* 2) Stock back up (safe) */
      if(productId){
        await adjustStock(productId, baseQty);
      }

      /* 3) Create credit note on the party */
      const creditNo = 'RET-' + Date.now().toString().slice(-6);
      await sb.from('invoices').insert({
        invoice_no: creditNo,
        party_id: selectedInvoice.party_id,
        party_type: selectedInvoice.party_type,
        subtotal: -amount,
        discount: 0,
        total: -amount,
        paid: 0,
        due: -amount,
        notes: 'Return refund from ' + selectedInvoice.invoice_no,
        invoice_date: dt.date,
        tx_time: dt.time
      });

      await syncDB();
      toast('Return recorded — stock restored & party credited','success');
      route();
    };
  }

  /* ---------- Return TO company ---------- */
  function renderToCompany(){
    $('#rt-tab-to').className = 'btn btn-primary';
    $('#rt-tab-from').className = 'btn btn-ghost';
    $('#rt-content').innerHTML = `
      <div class="card">
        <form id="rt-to-form" style="display:flex;flex-direction:column;gap:12px">
          ${dateTimeFieldHTML(null,'','Return Date')}
          <div><label class="label">Company *</label>${searchSelectHTML('rt-sup-ss','Search company...')}</div>
          <div><label class="label">Product *</label>${searchSelectHTML('rt-prod-ss','Search product...')}</div>
          <div class="grid-3">
            <div><label class="label">Qty *</label><input class="input" type="number" step="any" min="0.01" name="qty" value="1" id="rt-to-qty" required></div>
            <div><label class="label">Amount ₹ *</label><input class="input" type="number" step="0.01" min="0" name="amount" value="0" id="rt-to-amt" required></div>
            <div><label class="label">Reason</label><input class="input" name="reason" placeholder="Expiry, damage, etc."></div>
          </div>
          <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" id="rt-to-submit">Record Return to Company</button></div>
        </form>
      </div>
    `;

    const supSS = $('#rt-sup-ss');
    const prodSS = $('#rt-prod-ss');

    mountSearchSelect(supSS, {
      items: DB.suppliers.map(s=>({
        id: s.id,
        label: s.name,
        sublabel: s.phone || '',
        searchText: (s.name + ' ' + (s.phone||'')).toLowerCase()
      }))
    });

    mountSearchSelect(prodSS, {
      items: DB.products.map(productToOption),
      onSelect: opt => {
        if(!opt) return;
        const p = DB.products.find(x=>x.id===opt.id);
        if(p && $('#rt-to-amt')) $('#rt-to-amt').value = Number(p.cost)||0;
      }
    });

    $('#rt-to-form').onsubmit = async e => {
      e.preventDefault();
      const supId = supSS.getValue();
      const prodId = prodSS.getValue();
      if(!supId){ toast('Select a company','error'); return; }
      if(!prodId){ toast('Select a product','error'); return; }
      const dt = readDateTime(e.target); if(!dt) return;

      const fd = new FormData(e.target);
      const qty = Number(fd.get('qty'))||0;
      const amount = Number(fd.get('amount'))||0;
      if(qty <= 0){ toast('Qty must be > 0','error'); return; }
      if(amount < 0){ toast('Amount cannot be negative','error'); return; }

      const p = DB.products.find(x=>x.id===prodId);
      if(!p){ toast('Product not found','error'); return; }
      if(Number(p.stock) < qty){ toast('Not enough stock (' + fmtNum(p.stock) + ' available)','error'); return; }

      const btn = $('#rt-to-submit');
      btn.disabled = true; btn.textContent = 'Saving...';

      /* 1) Insert return */
      const { error } = await sb.from('returns').insert({
        direction: 'to_supplier',
        supplier_id: supId,
        product_id: prodId,
        product_name: p.name,
        unit: p.dual ? p.base_unit : p.unit,
        qty, base_qty: qty,
        amount,
        reason: fd.get('reason')||'',
        return_date: dt.date,
        tx_time: dt.time
      });
      if(error){
        toast(error.message,'error');
        btn.disabled = false; btn.textContent = 'Record Return to Company';
        return;
      }

      /* 2) Stock down (safe) */
      await adjustStock(prodId, -qty);

      /* 3) Reduce payable: record a credit-note supplier_payment */
      if(amount > 0){
        await sb.from('supplier_payments').insert({
          supplier_id: supId,
          amount,
          mode: 'credit-note',
          notes: 'Return: ' + p.name + ' x ' + qty,
          payment_date: dt.date,
          tx_time: dt.time
        });
      }

      await syncDB();
      toast('Return recorded — stock reduced & company payable adjusted','success');
      route();
    };
  }

  $('#rt-tab-from').onclick = renderFromParty;
  $('#rt-tab-to').onclick = renderToCompany;
  renderFromParty();
  renderList();
}

function renderExpenses(content){
  const list = DB.expenses;

  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);

  content.innerHTML = `

      <div style="flex:1;min-width:150px"><label class="label">From</label><input class="input" type="date" id="ex-from" value="${firstOfMonth}" max="${today}"></div>
      <div style="flex:1;min-width:150px"><label class="label">To</label><input class="input" type="date" id="ex-to" value="${today}" max="${today}"></div>

      <div style="flex:0 0 auto"><label class="label">&nbsp;</label><button class="btn btn-ghost" id="ex-clear">All Time</button></div>
    </div>
    <div class="grid-3" style="margin-bottom:16px">
      <div class="mini-stat" style="background:#fef2f2;border-color:#fecaca">
        <div class="lbl">Total (filtered)</div>
        <div class="val" style="color:var(--red);font-size:20px" id="ex-total">₹0.00</div>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Date</th><th>Category</th><th>Notes</th><th style="text-align:right">Amount</th><th></th></tr></thead>
          <tbody id="ex-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function filtered(){
    const f = $('#ex-from').value;
    const t = $('#ex-to').value;
    return list.filter(e=>{
      const d = txDate(e,'expense_date');
      if(f && d < f) return false;
      if(t && d > t) return false;
      return true;
    }).sort((a,b)=>txDate(b,'expense_date').localeCompare(txDate(a,'expense_date')));
  }

  function renderTable(){
    const arr = filtered();
    const tot = arr.reduce((s,e)=>s+Number(e.amount||0),0);
    $('#ex-total').textContent = rs(tot);
    $('#ex-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-2)">No expenses in this range</td></tr>`
      : arr.map(e=>`<tr>
        <td style="color:var(--text-2)">${txDT(e,'expense_date')}</td>

/* ---------- Expense form ---------- */
function openExpenseForm(existing){
  const e = existing || { amount:'', category:'', notes:'', expense_date:todayStr(), tx_time:'' };
  openModal(`
    <h2 style="font-size:16px;font-weight:600;margin-bottom:14px">${existing?'Edit':'Add'} Expense</h2>
    <form id="ef" style="display:flex;flex-direction:column;gap:12px">
      ${dateTimeFieldHTML(e.expense_date, e.tx_time, 'Expense Date')}
      <div><label class="label">Category *</label><input class="input" name="category" required value="${esc(e.category)}" placeholder="Electricity, WiFi, Transport..." autofocus></div>
      <div><label class="label">Amount (₹) *</label><input class="input" type="number" step="0.01" min="0.01" name="amount" required value="${e.amount}"></div>
      <div><label class="label">Notes</label><input class="input" name="notes" value="${esc(e.notes||'')}"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="ef-save">${existing?'Update':'Save'}</button>
      </div>
    </form>`, root => {
    root.querySelector('#ef').onsubmit = async e => {
      e.preventDefault();
      const dt = readDateTime(e.target); if(!dt) return;
      const fd = new FormData(e.target);
      const amt = Number(fd.get('amount'))||0;
      if(amt <= 0){ toast('Amount must be > 0','error'); return; }
      const data = {
        category: fd.get('category'),
        amount: amt,
        notes: fd.get('notes')||'',
        expense_date: dt.date,
        tx_time: dt.time || null
      };
      const btn = root.querySelector('#ef-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      let res;
      if(existing) res = await sb.from('expenses').update(data).eq('id', existing.id);
      else res = await sb.from('expenses').insert(data);
      if(res.error){
        toast(res.error.message,'error');
        btn.disabled = false; btn.textContent = 'Save';
        return;
      }
      await syncDB();
      toast(existing?'Updated':'Added','success');
      closeModal();
      route();
    };
  });
}

            tension:.3, fill:true, borderWidth:2, pointRadius:0, pointHoverRadius:5
          }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{position:'bottom'},
          tooltip:{callbacks:{label:c=>c.dataset.label+': '+rs(c.parsed.y)}}
        },
        scales:{
          y:{beginAtZero:true,ticks:{callback:v=>'₹'+Number(v).toLocaleString('en-IN')},grid:{color:'#f1f5f9'}},
          x:{grid:{display:false}}
        }
      }

  const ctx2 = $('#an-ch2');
  if(ctx2){

      type:'bar',

function renderPnL(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);

  content.innerHTML = `
    <div class="page-head"><div><h1>Profit &amp; Loss</h1><p>Product-wise profitability</p></div></div>
    <div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div><label class="label">From</label><input class="input" type="date" id="pnl-from" value="${firstOfMonth}" max="${today}"></div>
      <div><label class="label">To</label><input class="input" type="date" id="pnl-to" value="${today}" max="${today}"></div>
      <div><label class="label">&nbsp;</label><button class="btn btn-primary" id="pnl-load">Load</button></div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="pnl-today">Today</button>
        <button class="btn btn-ghost btn-sm" id="pnl-month">This month</button>
        <button class="btn btn-ghost btn-sm" id="pnl-year">This year</button>
      </div>
    </div>
    <div class="grid-4" id="pnl-stats" style="margin-bottom:16px"></div>
    <div class="card">
      <div class="card-title">Product-wise Profit</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Product</th><th style="text-align:right">Sold Qty</th><th style="text-align:right">Revenue</th><th style="text-align:right">Cost</th><th style="text-align:right">Profit</th><th style="text-align:right">Margin %</th></tr></thead>
          <tbody id="pnl-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function compute(from, to){
    const invs = DB.invoices.filter(i=>{
      const d = txDate(i,'invoice_date');
      return d >= from && d <= to;
    });

    const perProduct = {};
    let totalRevenue = 0;
    let totalCost = 0;

    invs.forEach(inv=>{
      const items = DB.invoice_items.filter(x=>x.invoice_id === inv.id);
      items.forEach(it=>{
        const p = DB.products.find(x=>x.id === it.product_id);
        const costPerBase = p ? Number(p.cost)||0 : 0;
        const baseQty = lineDeductBaseQty(it);
        const cost = baseQty * costPerBase;
        const rev = Number(it.total)||0;

        const key = it.product_id || it.product_name;
        if(!perProduct[key]){
          perProduct[key] = {
            name: it.product_name,
            revenue: 0,
            cost: 0,
            qty: 0,
            unit: (p ? (p.dual ? p.base_unit : p.unit) : '')
          };
        }
        perProduct[key].revenue += rev;
        perProduct[key].cost += cost;
        perProduct[key].qty += baseQty;

        totalRevenue += rev;
        totalCost += cost;
      });
    });

    const profit = totalRevenue - totalCost;
    const margin = totalRevenue > 0 ? (profit/totalRevenue)*100 : 0;
    return { perProduct, totalRevenue, totalCost, profit, margin, count: invs.length };
  }

  function render(){
    const from = $('#pnl-from').value;
    const to = $('#pnl-to').value;
    if(!from || !to){ toast('Pick both dates','error'); return; }
    if(from > to){ toast('From cannot be after To','error'); return; }

    const r = compute(from, to);

    $('#pnl-stats').innerHTML = `
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Revenue</div>
          <div class="kpi-icon" style="background:var(--blue-50);color:var(--blue-600)">💰</div>
        </div>
        <div class="kpi-value">${rs(r.totalRevenue)}</div>
        <div class="kpi-trend">${r.count} invoices</div>
      </div>
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Cost of Goods</div>
          <div class="kpi-icon" style="background:var(--amber-bg);color:var(--amber)">📦</div>
        </div>
        <div class="kpi-value">${rs(r.totalCost)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">${r.profit>=0?'Profit':'Loss'}</div>
          <div class="kpi-icon" style="background:${r.profit>=0?'var(--green-bg)':'var(--red-bg)'};color:${r.profit>=0?'var(--green)':'var(--red)'}">${r.profit>=0?'📈':'📉'}</div>
        </div>
        <div class="kpi-value" style="color:${r.profit>=0?'var(--green)':'var(--red)'}">${rs(r.profit)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-head">
          <div class="kpi-label">Margin</div>
          <div class="kpi-icon" style="background:var(--purple-bg);color:var(--purple)">%</div>
        </div>
        <div class="kpi-value">${r.margin.toFixed(1)}%</div>
      </div>
    `;

    const rows = Object.values(r.perProduct).sort((a,b)=>(b.revenue-b.cost)-(a.revenue-a.cost));

    $('#pnl-body').innerHTML = rows.length === 0
      ? `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-2)">No sales in this range</td></tr>`
      : rows.map(x=>{
        const p = x.revenue - x.cost;
        const m = x.revenue > 0 ? (p/x.revenue)*100 : 0;
        return `<tr>
          <td><strong>${esc(x.name)}</strong></td>
          <td style="text-align:right">${fmtNum(x.qty)} ${esc(x.unit)}</td>
          <td style="text-align:right">${rs(x.revenue)}</td>
          <td style="text-align:right;color:var(--text-2)">${rs(x.cost)}</td>
          <td style="text-align:right;font-weight:600;color:${p>=0?'var(--green)':'var(--red)'}">${rs(p)}</td>
          <td style="text-align:right;color:${m>=0?'var(--green)':'var(--red)'}">${m.toFixed(1)}%</td>
        </tr>`;
      }).join('');
  }

  $('#pnl-today').onclick = ()=>{ $('#pnl-from').value = today; $('#pnl-to').value = today; render(); };
  $('#pnl-month').onclick = ()=>{ $('#pnl-from').value = firstOfMonth; $('#pnl-to').value = today; render(); };
  $('#pnl-year').onclick = ()=>{ $('#pnl-from').value = new Date().getFullYear()+'-01-01'; $('#pnl-to').value = today; render(); };
  $('#pnl-load').onclick = render;

  render();
}

function renderShopHealth(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);

  let rangePreset = 'all';
  let customFrom = '';
  let customTo = '';

  content.innerHTML = `
    <div class="page-head"><div><h1>Shop Health</h1><p>Complete business snapshot</p></div></div>

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="sh-range">
        <button class="btn btn-sm btn-primary" data-r="all">All Time</button>
        <button class="btn btn-sm btn-ghost" data-r="today">Today</button>
        <button class="btn btn-sm btn-ghost" data-r="month">This Month</button>
        <button class="btn btn-sm btn-ghost" data-r="year">This Year</button>
        <button class="btn btn-sm btn-ghost" data-r="custom">Custom</button>
      </div>
      <div id="sh-custom" style="display:none;gap:8px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="sh-from"></div>
        <div><label class="label">To</label><input class="input" type="date" id="sh-to"></div>
        <div><label class="label">&nbsp;</label><button class="btn btn-primary btn-sm" id="sh-apply">Apply</button></div>
      </div>
    </div>

    <div class="card" id="sh-hero" style="text-align:center;padding:32px;margin-bottom:16px"></div>
    <div class="grid-3" id="sh-metrics" style="margin-bottom:16px"></div>
  `;

  /* ---------- Helpers ---------- */
  function range(){
    if(rangePreset === 'today') return { from: today, to: today };
    if(rangePreset === 'month') return { from: firstOfMonth, to: today };
    if(rangePreset === 'year')  return { from: new Date().getFullYear()+'-01-01', to: today };
    if(rangePreset === 'custom') return { from: customFrom||'0000-01-01', to: customTo||'9999-12-31' };
    return { from: '0000-01-01', to: '9999-12-31' };
  }

  function metrics(from, to){
    /* Sales */
    const invs = DB.invoices.filter(i=>{
      const d = txDate(i,'invoice_date');
      return d >= from && d <= to;
    });
    const grossSales = invs.reduce((s,i)=>s+Number(i.total||0),0);

    /* Returns */
    const returns = DB.returns.filter(r=>{
      const d = txDate(r,'return_date');
      return d >= from && d <= to;
    });
    const totalReturns = returns.reduce((s,r)=>s+Number(r.amount||0),0);

    const netSales = grossSales - totalReturns;

    /* Purchases */
    const bills = DB.supplier_invoices.filter(b=>{
      const d = txDate(b,'bill_date');
      return d >= from && d <= to;
    });
    const totalPurchases = bills.reduce((s,b)=>s+Number(b.total||0),0);

    /* Expenses */
    const exps = DB.expenses.filter(e=>{
      const d = txDate(e,'expense_date');
      return d >= from && d <= to;
    });
    const totalExpenses = exps.reduce((s,e)=>s+Number(e.amount||0),0);

    /* Party due (live — not date-filtered) */
    let partyDue = 0;
    DB.farmers.forEach(f=> partyDue += partyStats(f.id,'farmer').due);
    DB.retailers.forEach(r=> partyDue += partyStats(r.id,'retailer').due);

    /* Company payable (live) */
    let supplierDue = 0;
    DB.suppliers.forEach(s=> supplierDue += supplierTotals(s.id).total_due);

    /* Stock value (live) */
    let stockValue = 0;
    DB.products.forEach(p=> stockValue += (Number(p.stock)||0) * (Number(p.cost)||0));

    /* Profit */
    const profit = netSales - totalPurchases + stockValue - totalExpenses - supplierDue;
    const margin = netSales > 0 ? (profit/netSales)*100 : 0;

    return {
      grossSales, totalReturns, netSales,
      totalPurchases, partyDue, supplierDue,
      stockValue, totalExpenses, profit, margin,
      invoiceCount: invs.length
    };
  }

  /* ---------- Render ---------- */
  function render(){
    const { from, to } = range();
    const m = metrics(from, to);

    const isP = m.profit >= 0;
    const color = isP ? 'var(--green)' : 'var(--red)';
    const bg    = isP ? '#f0fdf4' : '#fef2f2';
    const border= isP ? '#bbf7d0' : '#fecaca';

    $('#sh-hero').style.background = bg;
    $('#sh-hero').style.borderColor = border;
    $('#sh-hero').innerHTML = `
      <div style="font-size:11px;color:${color};font-weight:700;letter-spacing:1.5px">${isP ? 'IN PROFIT' : 'IN LOSS'}</div>
      <div style="font-size:40px;font-weight:800;color:${color};margin:8px 0;line-height:1.1">${rs(Math.abs(m.profit))}</div>
      <div style="font-size:14px;color:var(--text-2)">Margin: <b style="color:${color}">${m.margin.toFixed(1)}%</b>   ${m.invoiceCount} invoice${m.invoiceCount===1?'':'s'}</div>
    `;

    const cards = [
      { lbl:'Net Sales',            txt: rs(m.netSales),       col:'var(--green)' },
      { lbl:'Purchases',            txt: rs(m.totalPurchases), col:'var(--amber)' },
      { lbl:'Party Due',            txt: rs(m.partyDue),       col:'var(--blue-600)' },
      { lbl:'Company Payable',      txt: rs(m.supplierDue),    col:'var(--red)' },
      { lbl:'Stock Value (cost)',   txt: rs(m.stockValue),     col:'var(--purple)' },
      { lbl:'Expenses',             txt: rs(m.totalExpenses),  col:'#f97316' }
    ];

    $('#sh-metrics').innerHTML = cards.map(c=>`
      <div class="card" style="border-left:4px solid ${c.col}">
        <div style="font-size:11px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px">${c.lbl}</div>
        <div style="font-size:20px;font-weight:700;color:${c.col};margin-top:5px">${c.txt}</div>
      </div>
    `).join('');
  }

  /* ---------- Events ---------- */
  $$('#sh-range button').forEach(b=>b.onclick = ()=>{
    rangePreset = b.dataset.r;
    $$('#sh-range button').forEach(x=>{
      x.className = x.dataset.r === rangePreset ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-ghost';
    });
    $('#sh-custom').style.display = rangePreset === 'custom' ? 'flex' : 'none';
    if(rangePreset !== 'custom') render();
  });

  $('#sh-apply').onclick = ()=>{
    customFrom = $('#sh-from').value;
    customTo   = $('#sh-to').value;
    if(!customFrom || !customTo){ toast('Pick both dates','error'); return; }
    if(customFrom > customTo){ toast('From cannot be after To','error'); return; }
    render();
  };

  render();
}

/* ============================================================
   PART 25 — BACKUP / RESTORE
   ============================================================ */
function renderBackup(content){
  content.innerHTML = `
    <div class="page-head"><div><h1>Backup &amp; Restore</h1><p>Download or restore your data</p></div></div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Download Backup</div>
      <p style="color:var(--text-2);font-size:13px;margin-bottom:14px">Get a full JSON snapshot of all your data.</p>
      <button id="btn-export" class="btn btn-primary">📥 Download Backup (JSON)</button>
    </div>

    <div class="card">
      <div class="card-title">Restore from Backup</div>
      <p style="color:var(--text-2);font-size:13px;margin-bottom:14px">This will ADD rows from a backup file. Existing data is not deleted.</p>
      <input type="file" id="restore-file" accept=".json" style="display:none">
      <button id="btn-restore" class="btn btn-ghost">📤 Choose Backup File</button>
    </div>
  `;

  /* ---------- Export ---------- */
  $('#btn-export').onclick = ()=>{
    const payload = {
      version: 1,
      exported_at: new Date().toISOString(),
      settings: SETTINGS,
      farmers: DB.farmers,
      retailers: DB.retailers,
      products: DB.products,
      invoices: DB.invoices,
      invoice_items: DB.invoice_items,
      payments: DB.payments,
      suppliers: DB.suppliers,
      supplier_invoices: DB.supplier_invoices,
      supplier_invoice_items: DB.supplier_invoice_items,
      supplier_payments: DB.supplier_payments,
      returns: DB.returns,
      expenses: DB.expenses
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded','success');
  };

  /* ---------- Restore ---------- */
  $('#btn-restore').onclick = ()=> $('#restore-file').click();

  $('#restore-file').onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = async ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!confirmDlg('Add all rows from this backup to Supabase?\n\nContinue?','Restore Backup')){
          e.target.value = '';
          return;
        }
        toast('Restoring... please wait','info');

        const tables = [
          'farmers','retailers','products',
          'invoices','invoice_items','payments',
          'suppliers','supplier_invoices','supplier_invoice_items','supplier_payments',
          'returns','expenses'
        ];

        for(const t of tables){
          if(Array.isArray(data[t]) && data[t].length){
            const { error } = await sb.from(t).insert(data[t]);
            if(error) console.warn('[restore] ' + t + ':', error.message);
          }
        }

        if(data.settings){
          SETTINGS = { ...SETTINGS, ...data.settings };
          await saveSettings();
        }

        await syncDB();
        toast('Backup restored','success');
        route();
      }catch(err){
        toast('Failed: ' + err.message,'error');
      }
      e.target.value = '';
    };
    r.readAsText(f);
  };
}
/* ============================================================
   PART 26 — USB PRINTING (WebUSB + ESC/POS)
   Isolated module. Delete this entire <script> block to remove.
   ============================================================ */
window.USBPrinter = (function(){
  let device = null;

  async function connect(){
    if(!navigator.usb){
      toast('USB printing not supported in this browser','error');
      return false;
    }
    try{
      device = await navigator.usb.requestDevice({ filters: [] });
      await device.open();
      if(device.configuration === null) await device.selectConfiguration(1);
      await device.claimInterface(0);
      toast('USB printer connected','success');
      return true;
    }catch(e){
      toast('USB connect failed: ' + e.message,'error');
      device = null;
      return false;
    }
  }

  async function rawPrint(text){
    if(!device){
      const ok = await connect();
      if(!ok) return;
    }
    const enc = new TextEncoder();
    const payload = enc.encode(text);
    try{
      await device.transferOut(1, payload);
    }catch(e){
      toast('USB write failed: ' + e.message,'error');
    }
  }

  async function printInvoice(inv, items, party){
    if(!device){
      const ok = await connect();
      if(!ok) return;
    }

    /* Plain text receipt (ESC/POS-compatible base) */
    const line = '--------------------------------';
    let txt = '';
    txt += (SETTINGS.shop_name || '') + '\n';
    if(SETTINGS.owner_name) txt += SETTINGS.owner_name + '\n';
    if(SETTINGS.address)    txt += SETTINGS.address + '\n';
    if(SETTINGS.phone)      txt += 'Ph: ' + SETTINGS.phone + '\n';
    if(SETTINGS.gst_enabled && SETTINGS.gst_number) txt += 'GSTIN: ' + SETTINGS.gst_number + '\n';
    txt += line + '\n';
    txt += 'Invoice: ' + (inv.invoice_no || '') + '\n';
    txt += 'Date: '    + txDT(inv,'invoice_date') + '\n';
    txt += 'Party: '   + (party?.name || '-') + '\n';
    txt += 'Type: '    + (inv.party_type === 'retailer' ? 'Retailer' : 'Farmer') + '\n';
    txt += line + '\n';

    for(const it of items){
      txt += productLineLabel(it) + '\n';
      txt += '  ' + fmtNum(it.qty) + ' x ' + Number(it.price).toFixed(2) + ' = ' + Number(it.total).toFixed(2) + '\n';
    }

    txt += line + '\n';
    txt += 'Subtotal: ' + Number(inv.subtotal).toFixed(2) + '\n';
    if(Number(inv.discount) > 0) txt += 'Discount: -' + Number(inv.discount).toFixed(2) + '\n';
    if(inv.gst_enabled) txt += 'GST @ ' + inv.gst_rate + '%: ' + Number(inv.gst_amount).toFixed(2) + '\n';
    txt += 'Total: ' + Number(inv.total).toFixed(2) + '\n';
    txt += 'Paid: '  + Number(inv.paid).toFixed(2)  + '\n';
    txt += 'Due: '   + Number(inv.due).toFixed(2)   + '\n';
    txt += '\n\n\n';

    await rawPrint(txt);
    toast('Sent to USB printer','success');
  }

  return { connect, rawPrint, printInvoice };
})();
/* ============================================================
   PART 27 — ROUTER
   ============================================================ */
async function route(){
  const hash = location.hash || '#/';

  /* Public portal links — not implemented (removed) */
  if(hash.startsWith('#/c/')){
    $('#app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-2)">Link not available.</div>';
    return;
  }

  /* Not logged in   login screen */
  if(!SESSION){
    renderLogin();
    return;
  }

  /* First load — fetch data */
  if(!DB.farmers.length && !DB.retailers.length && !DB.products.length && !DB.suppliers.length){
    await syncDB();
  }

  /* Render shell */
  renderLayout();
  const content = $('#content');
  const t = $('#topbar-title');
  if(t) t.textContent = currentPageTitle();

  try{
    if(hash === '#/' || hash === ''){
      renderDashboard(content);
    }
    else if(hash === '#/farmers'){
      renderFarmers(content);
    }
    else if(hash.startsWith('#/farmer/')){
      await renderPartyProfile(content, hash.slice(9), 'farmer');
    }
    else if(hash === '#/retailers'){
      renderRetailers(content);
    }
    else if(hash.startsWith('#/retailer/')){
      await renderPartyProfile(content, hash.slice(11), 'retailer');
    }
    else if(hash.startsWith('#/new-invoice/')){
      const parts = hash.slice(14).split('?');
      const type = parts[0];
      const params = new URLSearchParams(parts[1] || '');
      renderNewInvoice(content, type, params.get('party'));
    }
    else if(hash === '#/invoices'){
      renderInvoices(content);
    }
    else if(hash.startsWith('#/invoice/')){
      await renderInvoiceView(content, hash.slice(10));
    }
    else if(hash === '#/products'){
      renderProducts(content);
    }
    else if(hash === '#/companies'){
      renderCompanies(content);
    }
    else if(hash.startsWith('#/company/')){
      await renderCompanyProfile(content, hash.slice(10));
    }
    else if(hash === '#/purchases'){
      renderPurchases(content);
    }
    else if(hash === '#/returns'){
      renderReturns(content);
    }
    else if(hash === '#/expenses'){
      renderExpenses(content);
    }
    else if(hash === '#/analytics'){
      renderAnalytics(content);
    }
    else if(hash === '#/pnl'){
      renderPnL(content);
    }
    else if(hash === '#/reports'){
      renderReports(content);
    }
    else if(hash === '#/shop-health'){
      renderShopHealth(content);
    }
    else if(hash === '#/myshop'){
      renderMyShop(content);
    }
    else if(hash === '#/backup'){
      renderBackup(content);
    }
    else{
      renderDashboard(content);
    }
  }catch(err){
    console.error(err);
    content.innerHTML = '<div class="card" style="color:var(--red)"><b>Error:</b> ' + esc(err.message || String(err)) + '</div>';
  }
}

window.addEventListener('hashchange', route);
