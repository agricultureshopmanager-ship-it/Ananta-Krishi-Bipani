<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     PART 01 — HEAD, CDN LINKS, DESIGN SYSTEM CSS
     ============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriDist — Distributor Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.1/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;
  --bg:#f6f7f9;--card:#ffffff;--border:#e9ebef;--border-2:#dde1e7;
  --text:#0f172a;--text-2:#64748b;--text-3:#94a3b8;
  --green:#16a34a;--green-bg:#dcfce7;--red:#dc2626;--red-bg:#fee2e2;
  --amber:#f59e0b;--amber-bg:#fef3c7;--purple:#7c3aed;--purple-bg:#ede9fe;
  --pink:#db2777;--pink-bg:#fce7f3;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03);
  --shadow-md:0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue-600);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-weight:500;border:1px solid transparent;cursor:pointer;transition:.15s;font-size:13px;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--blue-600);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.2)}
.btn-primary:hover{background:var(--blue-700)}
.btn-ghost{background:#fff;color:var(--text);border-color:var(--border-2)}
.btn-ghost:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-danger{background:#fff;color:var(--red);border-color:#fecaca}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:11px 22px;font-size:14px}
.btn-icon{padding:8px;width:36px;height:36px}

/* ---- Inputs ---- */
.input{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:#fff;outline:none;font-size:13px;transition:.15s}
.input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-50)}
.input::placeholder{color:var(--text-3)}
textarea.input{resize:vertical;min-height:60px}
.label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:5px}
.field-hint{font-size:11px;color:var(--text-3);margin-top:4px}

/* ---- Cards ---- */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px;box-shadow:var(--shadow-sm)}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title small{font-weight:400;color:var(--text-2);font-size:12px}

/* ---- Grids ---- */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}

/* ---- Tables ---- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-2);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;background:#fafbfc}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfc}

/* ---- Layout ---- */
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--blue-600);color:#fff;border-radius:10px}
.brand-logo img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.brand-text{font-size:14px;font-weight:700;color:var(--text);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-text small{display:block;font-size:10px;color:var(--blue-600);font-weight:600;letter-spacing:.5px}
.nav-group{margin-bottom:6px}
.nav-group-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;padding:10px 12px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#475569;font-size:13px;font-weight:500;transition:.12s;text-decoration:none}
.nav a:hover{background:#f1f5f9;color:var(--text);text-decoration:none}
.nav a.active{background:var(--blue-50);color:var(--blue-700);font-weight:600}
.nav a .icon{font-size:15px;width:18px;text-align:center}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar-title{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-search{flex:1;max-width:320px;position:relative}
.topbar-search input{padding-left:36px;background:#f8fafc}
.topbar-search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5}
.main{flex:1;padding:24px;max-width:1440px;width:100%;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-head h1{font-size:22px;font-weight:700;margin-bottom:2px}
.page-head p{color:var(--text-2);font-size:13px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---- KPI card ---- */
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);transition:.15s}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500}
.kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.kpi-value{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px}
.kpi-trend{font-size:11px;display:flex;align-items:center;gap:5px;color:var(--text-2)}
.trend-up{color:var(--green);font-weight:600}
.trend-down{color:var(--red);font-weight:600}

/* ---- Chips / badges ---- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.chip-green{background:var(--green-bg);color:#15803d}
.chip-red{background:var(--red-bg);color:#b91c1c}
.chip-amber{background:var(--amber-bg);color:#b45309}
.chip-blue{background:var(--blue-100);color:var(--blue-700)}
.chip-gray{background:#f1f5f9;color:#475569}
.chip-purple{background:var(--purple-bg);color:#6d28d9}

/* ---- Search select ---- */
.searchselect{position:relative}
.ss-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border-2);border-radius:10px;max-height:280px;overflow-y:auto;box-shadow:var(--shadow-md);z-index:60;display:none;margin-top:4px}
.ss-dropdown.open{display:block}
.ss-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ss-item:last-child{border-bottom:0}
.ss-item:hover,.ss-item.active{background:var(--blue-50)}
.ss-item .sname{font-weight:500;font-size:13px}
.ss-item .ssub{font-size:11px;color:var(--text-2);margin-top:1px}
.ss-item .smeta{text-align:right;font-size:11px;flex-shrink:0}
.ss-item .smeta .due{color:var(--red);font-weight:600}
.ss-empty{padding:16px;text-align:center;color:var(--text-3);font-size:13px}
.ss-add{padding:10px;background:#f8fafc;text-align:center;cursor:pointer;color:var(--blue-700);font-weight:600;font-size:13px;border-top:1px solid var(--border)}
.ss-add:hover{background:var(--blue-50)}
.ss-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;color:var(--text-3);font-size:14px;padding:4px;line-height:1}
.ss-clear:hover{color:var(--red)}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .15s}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:pop .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ---- Toast ---- */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.15);animation:slideIn .25s}
.toast-success{background:#16a34a}
.toast-error{background:#dc2626}
@keyframes slideIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ---- Empty state ---- */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-icon{font-size:48px;opacity:.4;margin-bottom:12px}
.empty h3{font-size:16px;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px;margin-bottom:16px}

/* ---- Loading ---- */
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--text-2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue-600);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- Login ---- */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f8fafc,#eff6ff)}
.login-box{max-width:400px;width:100%;background:#fff;border-radius:16px;padding:32px;box-shadow:0 10px 40px rgba(15,23,42,.08);border:1px solid var(--border)}
.login-logo{width:56px;height:56px;border-radius:14px;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}

/* ---- Mini stat ---- */
.mini-stat{background:#f8fafc;padding:12px 14px;border-radius:10px;border:1px solid var(--border)}
.mini-stat .lbl{font-size:11px;color:var(--text-2);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.mini-stat .val{font-weight:700;margin-top:3px;font-size:15px}

/* ---- Calculator ---- */
.calc{position:fixed;bottom:24px;right:24px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.15);width:280px;z-index:150;border:1px solid var(--border)}
.calc-display{background:#f8fafc;padding:14px;border-radius:10px;text-align:right;font-family:ui-monospace,monospace;font-size:20px;margin-bottom:10px;overflow-x:auto;white-space:nowrap;border:1px solid var(--border)}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{padding:12px;border-radius:8px;background:#f8fafc;border:1px solid var(--border);cursor:pointer;font-weight:600;font-size:14px;transition:.1s}
.calc-keys button:hover{background:#eff6ff;border-color:var(--blue-100)}
.calc-keys button.op{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.calc-keys button.op:hover{background:var(--blue-700)}

/* ---- Mobile ---- */
.mobile-header{display:none;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;align-items:center;gap:12px}
.hamburger{background:transparent;border:0;font-size:20px;cursor:pointer;padding:4px}
#mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:none;overflow-x:auto;padding:6px 0;z-index:30;scrollbar-width:none}
#mobile-nav::-webkit-scrollbar{display:none}
#mobile-nav a{flex:0 0 68px;text-align:center;font-size:10px;padding:6px 2px;color:var(--text-2);text-decoration:none;font-weight:500}
#mobile-nav a.active{color:var(--blue-700);font-weight:700}
#mobile-nav a .mn-icon{font-size:16px;display:block}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}

@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:26;transition:left .25s;width:250px;height:100vh}
  .sidebar.open{left:0}
  .sidebar-backdrop.show{display:block}
  .mobile-header{display:flex}
  .topbar{display:none}
  .main{padding:16px;padding-bottom:80px}
  #mobile-nav{display:flex}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .page-head h1{font-size:19px}
  .kpi-value{font-size:20px}
  .modal{padding:18px;border-radius:12px}
  .card{padding:14px}
}

@media(max-width:768px){
  .modal-overlay{align-items:flex-start;padding:8px}
  .modal{max-width:100%;margin:8px 0;max-height:92vh}
  .modal .grid-2,.modal .grid-3,.modal .grid-4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!-- ============================================================
     PART 02 — BODY SHELL / ROOT CONTAINERS
     ============================================================ -->
<div id="error-box" style="position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:10px;font-size:11px;font-family:monospace;z-index:99999;display:none;white-space:pre-wrap;max-height:50vh;overflow:auto"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="calc-root"></div>
<script>
/* ============================================================
   PART 03 — CONFIG, SUPABASE CLIENT, DB STATE
   ============================================================ */
const SUPABASE_URL = 'https://jlamlcwrlpwbnzntgvny.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1UkihWeI5JWwj1j5LopdOQ_026MvUal';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BASE_UNITS = ['kg','gram','ton','quintal','ml','lit','piece'];
const PACK_UNITS = ['bottle','bag','pack','box','sack','pouch','sachet','tin','tube','can','jar','dozen','piece'];
const SUP_CATS = ['Fertilizer','Pesticide','Seed','Equipment','Other'];
const PRODUCT_CATS = ['Insecticide','Fungicide','Herbicide','Spreader','PGR','Bio stimulant','Fertilizer','Micro Nutrient','Seed','Other'];

let SETTINGS = {
  shop_name:'AgriDist', owner_name:'Owner', address:'', license:'',
  upi:'', phone:'', email:'', logo:'',
  gst_enabled:false, gst_number:'', gst_rate:18
};
let SESSION = null;
let charts = [];

const DB = {
  farmers:[], retailers:[], products:[], invoices:[], invoice_items:[],
  payments:[], suppliers:[], supplier_invoices:[], supplier_invoice_items:[],
  supplier_payments:[], returns:[], expenses:[], settings:null
};
/* ============================================================
   PART 04 — UTILITY HELPERS
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const todayStr = ()=> new Date().toISOString().slice(0,10);
const isFuture = d => d && d > todayStr();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function inr(n){
  const num = Number(n||0); const neg = num<0; const s = Math.abs(num).toFixed(2);
  const parts = s.split('.'); let intPart = parts[0]; const decPart = parts[1];
  if(intPart.length>3){
    const last3 = intPart.slice(-3); const rest = intPart.slice(0,-3);
    intPart = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg?'-':'') + intPart + '.' + decPart;
}
const rs = n => '₹' + inr(n);
const fmtNum = n => { const v = Number(n||0); return v%1===0 ? String(v) : v.toFixed(2); };
const fmtDate = d => { if(!d) return '-'; const s = String(d).slice(0,10); return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const txDate = (r,k) => (r && (r[k] || (r.created_at ? r.created_at.slice(0,10) : ''))) || '';
const txDT = (r,k) => { if(!r) return '-'; const d = txDate(r,k); if(!d) return '-'; return fmtDate(d) + (r.tx_time ? ' ' + r.tx_time : ''); };
const enteredOn = r => { if(!r||!r.created_at) return ''; const d = new Date(r.created_at); return 'Entered: ' + d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); };

function toast(msg,type='info'){
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

function openModal(html, onMount){
  const root = $('#modal-root');
  const wrapper = document.createElement('div');
  wrapper.className = 'modal-overlay';
  wrapper.innerHTML = `<div class="modal">${html}</div>`;
  wrapper.addEventListener('click', e => {
    if(e.target === wrapper) closeModal(wrapper);
  });
  root.appendChild(wrapper);
  if(onMount) onMount(wrapper);
  return wrapper;
}
function closeModal(el){
  const root = $('#modal-root');
  if(el && el.parentNode === root){
    root.removeChild(el);
  } else {
    const last = root.lastElementChild;
    if(last) root.removeChild(last);
  }
}

function confirmDlg(msg,title){ return confirm((title?title+'\n\n':'') + msg); }

function dateTimeFieldHTML(dateVal,timeVal,label){
  const today = todayStr();
  return `<div class="grid-2">
    <div><label class="label">${label||'Date'} *</label><input class="input" type="date" name="tx_date" required max="${today}" value="${dateVal||today}"></div>
    <div><label class="label">Time (optional)</label><input class="input" type="time" name="tx_time" value="${timeVal||''}"></div>
  </div>`;
}
function readDateTime(form){
  const dEl = form.querySelector('input[name="tx_date"]');
  const tEl = form.querySelector('input[name="tx_time"]');
  const d = dEl ? dEl.value : '';
  const tm = (tEl && tEl.value ? tEl.value : '').trim();
  if(!d){ toast('Please pick a date','error'); return null; }
  if(isFuture(d)){ toast('Future dates are not allowed','error'); return null; }
  return { date:d, time:tm };
}

function nextInvoiceNo(){
  let max = 0;
  DB.invoices.forEach(inv=>{
    const m = String(inv.invoice_no||'').match(/(\d+)/);
    if(m){ const n = parseInt(m[1]); if(n>max) max = n; }
  });
  return 'INV-' + String(max+1).padStart(4,'0');
}

/* ---- Product display ---- */
function productDisplay(p){
  if(p.dual){
    const packs = p.pack_size ? Number(p.stock)/Number(p.pack_size) : 0;
    const packStr = fmtNum(packs) + ' ' + p.pack_unit + (packs===1?'':'s');
    const baseStr = fmtNum(p.stock) + ' ' + p.base_unit;
    const primaryIsPack = p.primary_unit === 'pack_unit';
    const primary = primaryIsPack ? packStr : baseStr;
    const secondary = primaryIsPack ? baseStr : packStr;
    return { primary, secondary, stockLabel:primary, fullText: primary + ' (' + secondary + ')',
      subline: fmtNum(p.pack_size) + ' ' + p.base_unit + ' / ' + p.pack_unit };
  }
  const str = fmtNum(p.stock) + ' ' + p.unit;
  return { primary:str, secondary:'', stockLabel:str, fullText:str, subline:'Cost ₹' + fmtNum(p.cost||0) + '/' + p.unit };
}
function isLowStock(p){ return Number(p.stock) <= Number(p.low_stock_alert); }
function isOutOfStock(p){ return Number(p.stock) <= 0; }
function stockBadge(p){
  if(isOutOfStock(p)) return '<span class="chip chip-gray">OUT</span>';
  if(isLowStock(p)) return '<span class="chip chip-red">LOW</span>';
  return '<span class="chip chip-green">OK</span>';
}
function productLineLabel(line){
  if(line.dual){
    if(line.unit === line.pack_unit) return line.product_name + ' — ' + fmtNum(line.pack_size) + ' ' + line.base_unit + ' (' + line.pack_unit + ')';
    return line.product_name + ' — ' + line.unit;
  }
  return line.product_name + (line.unit ? ' — ' + line.unit : '');
}
function lineDeductBaseQty(line){
  if(line.dual && line.unit === line.pack_unit) return Number(line.qty) * Number(line.pack_size);
  return Number(line.qty);
}

/* ---- Party stats ---- */
function partyStats(partyId, partyType){
  const invs = DB.invoices.filter(i => i.party_id === partyId && i.party_type === partyType);
  const pays = DB.payments.filter(p => p.party_id === partyId && p.party_type === partyType);
  const total_bought = invs.reduce((s,i)=>s+Number(i.total||0),0);
  const total_paid = pays.reduce((s,p)=>s+Number(p.amount||0),0) + invs.reduce((s,i)=>s+Number(i.paid||0),0);
  const due = Math.max(0, total_bought - total_paid);
  return { total_bought, total_paid, due };
}
function computeRating(stats){
  if(!stats.total_bought || Number(stats.total_bought)===0) return 5;
  const ratio = Number(stats.total_paid)/Number(stats.total_bought);
  let score = ratio*5;
  if(Number(stats.due)>0){
    const d = Number(stats.due)/Number(stats.total_bought);
    if(d>0.5) score -= 1.5; else if(d>0.25) score -= 0.8;
  }
  return Math.max(1, Math.min(5, Math.round(score*10)/10));
}

/* ---- Supplier stats ---- */
function supplierTotals(sid){
  const sup = DB.suppliers.find(s=>s.id===sid);
  const bills = DB.supplier_invoices.filter(b=>b.supplier_id===sid);
  const pays = DB.supplier_payments.filter(p=>p.supplier_id===sid);
  const total_purchase = bills.reduce((s,b)=>s+Number(b.total||0),0);
  const bill_paid = bills.reduce((s,b)=>s+Number(b.paid||0),0);
  const extra_paid = pays.reduce((s,p)=>s+Number(p.amount||0),0);
  const total_paid = bill_paid + extra_paid;
  const opening = Number(sup?.opening_balance||0);
  const total_due = Math.max(0, opening + total_purchase - total_paid);
  return { total_purchase, total_paid, total_due, bill_paid, extra_paid, opening };
}

/* ---- STOCK HELPERS ---- */
async function adjustStock(productId, delta){
  const { data: fresh, error: fe } = await sb.from('products').select('stock').eq('id', productId).single();
  if(fe || !fresh) return false;
  const newStock = Number(fresh.stock) + Number(delta);
  const { error } = await sb.from('products').update({ stock: newStock }).eq('id', productId);
  return !error;
}

function checkStock(lines){
  for(const l of lines){
    const p = DB.products.find(x => x.id === l.product_id);
    if(!p) continue;
    const need = lineDeductBaseQty(l);
    if(Number(p.stock) < need){
      const unit = (p.dual?p.base_unit:p.unit);
      return { ok:false, productName:p.name, need, available:Number(p.stock), unit };
    }
  }
  return { ok:true };
}

function searchSelectHTML(id, placeholder){
  return `<div class="searchselect" id="${id}">
    <input type="text" class="input ss-input" placeholder="${placeholder||'Search...'}" autocomplete="off" style="padding-right:32px">
    <button type="button" class="ss-clear" style="display:none">×</button>
    <div class="ss-dropdown"></div>
    <input type="hidden" class="ss-value" value="">
  </div>`;
}

function mountSearchSelect(rootEl, opts){
  const input = rootEl.querySelector('.ss-input');
  const dropdown = rootEl.querySelector('.ss-dropdown');
  const clearBtn = rootEl.querySelector('.ss-clear');
  const hidden = rootEl.querySelector('.ss-value');
  let activeIdx = -1;
  let filtered = [];
  let items = opts.items || [];

  function render(query){
    const q = (query||'').toLowerCase().trim();
    filtered = items.filter(it => !q || it.searchText.toLowerCase().includes(q));
    let html = '';
    if(!filtered.length){
      html = '<div class="ss-empty">No matches found</div>';
    } else {
      html = filtered.map((it,i)=>`<div class="ss-item ${i===activeIdx?'active':''}" data-idx="${i}">
        <div style="flex:1;min-width:0;overflow:hidden">
          <div class="sname">${esc(it.label)}</div>
          ${it.sublabel?`<div class="ssub">${esc(it.sublabel)}</div>`:''}
        </div>
        <div class="smeta">
          ${it.dueText?`<div class="due">${esc(it.dueText)}</div>`:''}
          ${it.metaText?`<div>${esc(it.metaText)}</div>`:''}
        </div>
      </div>`).join('');
    }
    if(opts.allowAdd) html += `<div class="ss-add">+ Add new</div>`;
    dropdown.innerHTML = html;
    dropdown.classList.add('open');
    dropdown.querySelectorAll('.ss-item').forEach(el=>{
      el.onclick = ()=> pick(parseInt(el.dataset.idx));
    });
    const addEl = dropdown.querySelector('.ss-add');
    if(addEl) addEl.onclick = ()=>{ dropdown.classList.remove('open'); if(opts.onAdd) opts.onAdd(); };
  }

  function pick(i){
    const it = filtered[i];
    if(!it) return;
    hidden.value = it.id;
    input.value = it.label + (it.sublabel ? ' — ' + it.sublabel : '');
    dropdown.classList.remove('open');
    clearBtn.style.display = 'block';
    if(opts.onSelect) opts.onSelect(it);
  }

  function clear(){
    hidden.value = '';
    input.value = '';
    clearBtn.style.display = 'none';
    if(opts.onSelect) opts.onSelect(null);
  }

  input.addEventListener('focus', ()=> render(input.value.replace(/ — .*$/,'').trim()));
  input.addEventListener('input', ()=>{
    activeIdx = -1;
    hidden.value = '';
    clearBtn.style.display = input.value ? 'block' : 'none';
    render(input.value);
  });
  input.addEventListener('keydown', e=>{
    if(!dropdown.classList.contains('open')) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, filtered.length-1); render(input.value); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); render(input.value); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(activeIdx>=0) pick(activeIdx); }
    else if(e.key === 'Escape'){ dropdown.classList.remove('open'); }
  });
  clearBtn.onclick = e => { e.stopPropagation(); clear(); input.focus(); };
  document.addEventListener('click', e=>{ if(!rootEl.contains(e.target)) dropdown.classList.remove('open'); });

  rootEl.getValue = () => hidden.value;
  rootEl.setItems = list => { items = list; };
  rootEl.setValue = id => {
    const it = items.find(x => x.id === id);
    if(it){
      hidden.value = id;
      input.value = it.label + (it.sublabel ? ' — ' + it.sublabel : '');
      clearBtn.style.display = 'block';
    }
  };
  rootEl.reset = clear;
  return rootEl;
}

let calcOpen = false;

function toggleCalc(){
  calcOpen = !calcOpen;
  const root = $('#calc-root');
  if(!calcOpen){ root.innerHTML = ''; return; }
  let val = '0';

  const render = ()=>{
    root.innerHTML = `<div class="calc">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:13px;font-weight:600">Calculator</span>
        <button class="btn btn-ghost btn-sm" id="calc-close">✕</button>
      </div>
      <div class="calc-display">${val}</div>
      <div class="calc-keys">
        ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫'].map(k=>{
          const op = ['/','*','-','+','='].includes(k) ? 'op' : '';
          return `<button class="${op}" data-k="${k}">${k}</button>`;
        }).join('')}
      </div>
    </div>`;
    $('#calc-close').onclick = toggleCalc;
    $$('#calc-root button[data-k]').forEach(b=>b.onclick = ()=>push(b.dataset.k));
  };

  const push = k => {
    if(k === 'C') val = '0';
    else if(k === '⌫') val = val.length>1 ? val.slice(0,-1) : '0';
    else if(k === '='){
      try{ val = String(Function('"use strict";return ('+val+')')()); }
      catch{ val = 'Err'; }
    }
    else val = val === '0' ? k : val + k;
    render();
  };

  render();
}

function renderFarmers(content){
  const list = DB.farmers;
  content.innerHTML = `
    <div class="page-head">
      <div><h1>Farmers</h1><p>${list.length} farmers   direct customers</p></div>
      <div class="page-actions">
        <button class="btn btn-ghost" onclick="location.hash='#/new-invoice/farmer'">📄 New Invoice</button>
        <button class="btn btn-primary" id="add-farmer">+ Add Farmer</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div style="flex:2;min-width:220px"><label class="label">Search</label><input class="input" id="f-search" placeholder="Name or phone..."></div>
      <div style="flex:1;min-width:150px"><label class="label">Sort</label>
        <select class="input" id="f-sort">
          <option value="name">Name (A–Z)</option>
          <option value="name-desc">Name (Z–A)</option>
          <option value="due-desc">Due (high first)</option>
          <option value="due">Due (low first)</option>
        </select>
      </div>
      <div style="flex:0 0 auto"><label class="label">&nbsp;</label>
        <select class="input" id="f-filter">
          <option value="">All</option>
          <option value="due">Only with due</option>
          <option value="nodue">Only cleared</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Joined</th><th>Rating</th><th style="text-align:right">Due</th><th></th></tr></thead>
          <tbody id="f-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function filtered(){
    const q = ($('#f-search').value||'').toLowerCase().trim();
    const sortBy = $('#f-sort').value;
    const flt = $('#f-filter').value;
    let arr = list.map(p=>({ ...p, _stats: partyStats(p.id,'farmer') })).filter(p=>{
      if(q && !(p.name.toLowerCase().includes(q) || (p.phone||'').includes(q))) return false;
      if(flt === 'due' && !(p._stats.due > 0)) return false;
      if(flt === 'nodue' && p._stats.due > 0) return false;
      return true;
    });
    if(sortBy === 'name') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortBy === 'name-desc') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>b._stats.due - a._stats.due);
    else if(sortBy === 'due') arr.sort((a,b)=>a._stats.due - b._stats.due);
    return arr;
  }

  function renderTable(){
    const arr = filtered();
    $('#f-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-2)">No farmers match</td></tr>`
      : arr.map(f=>{
        const st = f._stats;
        const rating = computeRating(st);
        return `<tr>
          <td><a href="#/farmer/${f.id}" style="font-weight:600">${esc(f.name)}</a></td>
          <td>${f.phone ? `<a href="tel:${f.phone}" style="color:var(--text-2)">${esc(f.phone)}</a>` : '—'}</td>
          <td style="color:var(--text-2)">${fmtDate(f.joined_date)}</td>
          <td><span class="chip chip-amber">${rating} ★</span></td>
          <td style="text-align:right;font-weight:600;color:${st.due>0?'var(--red)':'var(--text-2)'}">${rs(st.due)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-ghost btn-sm" data-view="${f.id}">View</button>
            <button class="btn btn-ghost btn-sm" data-del="${f.id}" style="color:var(--red)">Del</button>
          </td>
        </tr>`;
      }).join('');
    $$('[data-view]').forEach(b=>b.onclick=()=> location.hash = '#/farmer/' + b.dataset.view);
    $$('[data-del]').forEach(b=>b.onclick=async()=>{
      const f = DB.farmers.find(x=>x.id===b.dataset.del);
      if(!f) return;
      const invCount = DB.invoices.filter(i=>i.party_id===f.id && i.party_type==='farmer').length;
      const payCount = DB.payments.filter(p=>p.party_id===f.id && p.party_type==='farmer').length;
      const warn = (invCount || payCount)
        ? `Delete farmer "${f.name}"?\n\n⚠️ Their ${invCount} invoice(s) and ${payCount} payment(s) will remain in the system but won't be linked to any farmer.\n\nContinue?`
        : `Delete farmer "${f.name}"?`;
      if(!confirmDlg(warn,'Confirm Delete')) return;
      await sb.from('farmers').delete().eq('id', f.id);
      await syncDB(); toast('Farmer deleted','success'); renderTable();
    });
  }

  ['f-search','f-sort','f-filter'].forEach(id=>{ $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  $('#add-farmer').onclick = ()=> openPartyForm('farmer');
}

/* ---------- Party (farmer/retailer) add/edit ---------- */
function openPartyForm(type, existing){
  const isRetailer = type === 'retailer';
  const table = isRetailer ? 'retailers' : 'farmers';
  const title = isRetailer ? 'Retailer' : 'Farmer';
  const p = existing || { name:'', phone:'', address:'', joined_date:todayStr(), tx_time:'' };
  openModal(`
    <h2 style="font-size:16px;font-weight:600;margin-bottom:16px">${existing ? 'Edit' : 'New'} ${title}</h2>
    <form id="pf" style="display:flex;flex-direction:column;gap:12px">
      <div><label class="label">Name *</label><input class="input" name="name" required value="${esc(p.name||'')}" autofocus></div>
      <div><label class="label">Phone</label><input class="input" name="phone" value="${esc(p.phone||'')}"></div>
      <div><label class="label">Address</label><input class="input" name="address" value="${esc(p.address||'')}"></div>
      ${dateTimeFieldHTML(p.joined_date||todayStr(), p.tx_time||'', isRetailer ? 'Onboarded' : 'Joined')}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="pf-save">${existing ? 'Update' : 'Save'}</button>
      </div>
    </form>`, root => {
    root.querySelector('#pf').onsubmit = async e => {
      e.preventDefault();
      const dt = readDateTime(e.target); if(!dt) return;
      const fd = new FormData(e.target);
      const data = {
        name: fd.get('name'),
        phone: fd.get('phone')||'',
        address: fd.get('address')||'',
        joined_date: dt.date,
        tx_time: dt.time
      };
      const btn = root.querySelector('#pf-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      let res;
      if(existing) res = await sb.from(table).update(data).eq('id', existing.id).select().single();
      else res = await sb.from(table).insert(data).select().single();
      if(res.error){
        toast(res.error.message,'error');
        btn.disabled = false; btn.textContent = existing?'Update':'Save';
        return;
      }
      await syncDB();
      toast(existing ? 'Updated' : 'Added','success');
      closeModal();
      route();
    };
  });
}

                  <div style="font-weight:600">${rs(i.total)}</div>

              </div>`).join('')}</div>`}

      <div class="card">
        <div class="card-title">Payments <small>${pays.length}</small></div>
        ${!pays.length
          ? '<p style="color:var(--text-3);font-size:13px;text-align:center;padding:20px 0">No payments yet</p>'

      let res;
      if(existing) res = await sb.from('payments').update(data).eq('id', existing.id);
      else res = await sb.from('payments').insert(data);
      if(res.error){ toast(res.error.message,'error'); btn.disabled = false; btn.textContent = 'Save'; return; }
      await syncDB();
      toast('Payment saved','success');
      closeModal();
      route();
    };
  });
}

  content.innerHTML = `
    <div class="page-head">
      <div><h1>Retailers</h1><p>${list.length} retail shops   your primary buyers</p></div>
      <div class="page-actions">
        <button class="btn btn-ghost" onclick="location.hash='#/new-invoice/retailer'">📄 New Invoice</button>

        </select>

    <div class="card">

          <thead><tr><th>Shop Name</th><th>Phone</th><th>Onboarded</th><th>Rating</th><th style="text-align:right">Due</th><th></th></tr></thead>
          <tbody id="r-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function filtered(){
    const q = ($('#r-search').value||'').toLowerCase().trim();
    const sortBy = $('#r-sort').value;
    const flt = $('#r-filter').value;
    let arr = list.map(p=>({ ...p, _stats: partyStats(p.id,'retailer') })).filter(p=>{
      if(q && !(p.name.toLowerCase().includes(q) || (p.phone||'').includes(q))) return false;
      if(flt === 'due' && !(p._stats.due > 0)) return false;
      if(flt === 'nodue' && p._stats.due > 0) return false;
      return true;
    });
    if(sortBy === 'name') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortBy === 'name-desc') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>b._stats.due - a._stats.due);
    else if(sortBy === 'due') arr.sort((a,b)=>a._stats.due - b._stats.due);
    return arr;
  }

  function renderTable(){
    const arr = filtered();
    $('#r-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-2)">No retailers match</td></tr>`
      : arr.map(r=>{
        const st = r._stats;

          <td style="color:var(--text-2)">${fmtDate(r.joined_date)}</td>
          <td><span class="chip chip-amber">${rating} ★</span></td>
          <td style="text-align:right;font-weight:600;color:${st.due>0?'var(--red)':'var(--text-2)'}">${rs(st.due)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-ghost btn-sm" data-view="${r.id}">View</button>
            <button class="btn btn-ghost btn-sm" data-del="${r.id}" style="color:var(--red)">Del</button>
          </td>
        </tr>`;
      }).join('');
    $$('[data-view]').forEach(b=>b.onclick=()=> location.hash = '#/retailer/' + b.dataset.view);
    $$('[data-del]').forEach(b=>b.onclick=async()=>{
      const r = DB.retailers.find(x=>x.id===b.dataset.del);
      if(!r) return;
      const invCount = DB.invoices.filter(i=>i.party_id===r.id && i.party_type==='retailer').length;
      const payCount = DB.payments.filter(p=>p.party_id===r.id && p.party_type==='retailer').length;
      const warn = (invCount || payCount)
        ? `Delete retailer "${r.name}"?\n\n⚠️ Their ${invCount} invoice(s) and ${payCount} payment(s) will remain in the system but won't be linked to any retailer.\n\nContinue?`
        : `Delete retailer "${r.name}"?`;
      if(!confirmDlg(warn,'Confirm Delete')) return;
      await sb.from('retailers').delete().eq('id', r.id);
      await syncDB(); toast('Retailer deleted','success'); renderTable();
    });
  }

  ['r-search','r-sort','r-filter'].forEach(id=>{ $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  $('#add-retailer').onclick = ()=> openPartyForm('retailer');
}
/* ============================================================
   PART 13 — SHARED INVOICE BUILDER (used by farmer & retailer)
   ============================================================ */
function renderNewInvoice(content, partyType, preselectPartyId){
  const isRetailer = partyType === 'retailer';
  const parties = isRetailer ? DB.retailers : DB.farmers;
  const partyLabel = isRetailer ? 'Retailer' : 'Farmer';

  let lines = [];

  content.innerHTML = `
    <a href="#/${isRetailer?'retailers':'farmers'}" style="color:var(--text-2);font-size:13px">← Back</a>
    <div class="page-head" style="margin-top:8px">
      <div><h1>New Invoice — ${partyLabel}</h1><p>Add items, enter the selling price manually</p></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      ${dateTimeFieldHTML(null,'','Invoice Date')}
      <div>
        <label class="label">${partyLabel} *</label>
        ${searchSelectHTML('ni-party-ss','Type name or phone...')}
      </div>
      <div>
        <label class="label">Add Item</label>
        ${searchSelectHTML('ni-prod-ss','Type product name...')}
      </div>
      <div id="ni-lines"></div>

      ${SETTINGS.gst_enabled ? `
        <div style="padding:12px;background:var(--blue-50);border-radius:10px;border:1px solid var(--blue-100)">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
            <input type="checkbox" id="ni-gst" checked>
            Apply GST @ ${SETTINGS.gst_rate}% (${esc(SETTINGS.gst_number||'no GSTIN set')})
          </label>
        </div>`:''}

      <div class="grid-3">
        <div><label class="label">Discount (₹)</label><input class="input" type="number" step="0.01" id="ni-disc" value="0"></div>
        <div><label class="label">Paid Now (₹)</label><input class="input" type="number" step="0.01" id="ni-paid" value="0"></div>
        <div><label class="label">Notes</label><input class="input" id="ni-notes"></div>
      </div>

      <div id="ni-summary" style="background:#f8fafc;padding:14px;border-radius:10px;border:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px;font-weight:500"></div>

      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="history.back()">Cancel</button>
        <button class="btn btn-ghost" id="ni-save-print">Save &amp; Print</button>
        <button class="btn btn-primary" id="ni-save">Save Invoice</button>
      </div>
    </div>
  `;

  const partySS = $('#ni-party-ss');
  mountSearchSelect(partySS, {
    items: parties.map(p=>partyToOption(p, partyType)),
    allowAdd: true,
    onAdd: ()=> openPartyForm(partyType)
  });
  if(preselectPartyId) partySS.setValue(preselectPartyId);

  const prodSS = $('#ni-prod-ss');
  mountSearchSelect(prodSS, {
    items: DB.products.map(productToOption),
    onSelect: (opt)=>{
      if(!opt) return;
      const p = DB.products.find(x=>x.id===opt.id);
      if(!p) return;
      addLine(p);
      setTimeout(()=>prodSS.reset(), 50);
    }
  });

  function addLine(p){
    if(p.dual){
      const primaryUnit = p.primary_unit === 'pack_unit' ? p.pack_unit : p.base_unit;
      lines.push({
        product_id:p.id, product_name:p.name, dual:true,
        base_unit:p.base_unit, pack_unit:p.pack_unit,
        pack_size:Number(p.pack_size)||1,
        unit:primaryUnit, qty:1, price:0, total:0
      });
    } else {
      lines.push({
        product_id:p.id, product_name:p.name, dual:false,
        unit:p.unit, qty:1, price:0, total:0
      });
    }
    renderLines();
  }

  function renderLines(){
    const box = $('#ni-lines');
    if(!lines.length){
      box.innerHTML = '<p style="color:var(--text-3);font-size:13px;text-align:center;padding:20px 0">No items added yet. Search and add products above.</p>';
    } else {
      box.innerHTML = `<div class="tbl-wrap"><table>
        <thead><tr><th style="width:35%">Item</th><th>Qty</th><th>Unit</th><th>Price ₹</th><th style="text-align:right">Total</th><th></th></tr></thead>
        <tbody>${lines.map((l,i)=>{
          const unitCell = l.dual
            ? `<select class="input" data-i="${i}" data-f="unit" style="padding:6px 8px">
                <option value="${l.pack_unit}" ${l.unit===l.pack_unit?'selected':''}>${l.pack_size} ${l.base_unit} (${l.pack_unit})</option>
                <option value="${l.base_unit}" ${l.unit===l.base_unit?'selected':''}>${l.base_unit}</option>
              </select>`
            : `<span style="font-size:12px;color:var(--text-2)">${esc(l.unit||'—')}</span>`;
          return `<tr>
            <td><strong>${esc(l.product_name)}</strong></td>
            <td><input class="input" type="number" step="0.01" min="0.01" data-i="${i}" data-f="qty" value="${l.qty}" style="width:80px;padding:6px 8px"></td>
            <td>${unitCell}</td>
            <td><input class="input" type="number" step="0.01" min="0.01" data-i="${i}" data-f="price" value="${l.price}" placeholder="0.00" style="width:100px;padding:6px 8px"></td>
            <td style="text-align:right;font-weight:600">${rs(l.total)}</td>
            <td><button class="btn btn-ghost btn-sm" data-del="${i}" style="color:var(--red)">✕</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;

      $$('input[data-i]',box).forEach(inp=>inp.oninput = e => {
        const i = +e.target.dataset.i;
        const f = e.target.dataset.f;
        lines[i][f] = Number(e.target.value)||0;
        lines[i].total = lines[i].qty * lines[i].price;
        renderLines();
      });
      $$('select[data-i]',box).forEach(sel=>sel.onchange = e => {
        const i = +e.target.dataset.i;
        lines[i].unit = e.target.value;
        renderLines();
      });
      $$('[data-del]',box).forEach(b=>b.onclick = ()=>{ lines.splice(+b.dataset.del,1); renderLines(); });
    }
    updateSummary();
  }

  function updateSummary(){
    const sub = lines.reduce((s,l)=>s + (Number(l.total)||0), 0);
    const disc = Number($('#ni-disc').value)||0;
    const gstOn = SETTINGS.gst_enabled && $('#ni-gst') && $('#ni-gst').checked;
    const gstRate = gstOn ? (Number(SETTINGS.gst_rate)||0) : 0;
    const afterDisc = Math.max(0, sub - disc);
    const gstAmt = gstOn ? (afterDisc * gstRate / 100) : 0;
    const total = afterDisc + gstAmt;
    const paid = Number($('#ni-paid').value)||0;
    const due = Math.max(0, total - paid);
    $('#ni-summary').innerHTML = `
      <div>Subtotal: <b>${rs(sub)}</b></div>
      ${disc>0?`<div>Discount: <b style="color:var(--red)">− ${rs(disc)}</b></div>`:''}
      ${gstOn?`<div>GST (${gstRate}%): <b>${rs(gstAmt)}</b></div>`:''}
      <div>Total: <b style="color:var(--blue-700);font-size:15px">${rs(total)}</b></div>
      <div>Paid: <b style="color:var(--green)">${rs(paid)}</b></div>
      <div>Due: <b style="color:${due>0?'var(--red)':'var(--green)'}">${rs(due)}</b></div>
    `;
  }

  $('#ni-disc').oninput = updateSummary;
  $('#ni-paid').oninput = updateSummary;
  if($('#ni-gst')) $('#ni-gst').onchange = updateSummary;
  renderLines();

  async function saveInvoice(){
    if(!lines.length){ toast('Add at least one item','error'); return null; }

    /* Validate qty & price */
    for(const l of lines){
      if(!(Number(l.qty) > 0)){ toast('Qty must be greater than 0 for ' + l.product_name,'error'); return null; }
      if(!(Number(l.price) > 0)){ toast('Enter selling price for ' + l.product_name,'error'); return null; }
    }

    /* Party */
    const partyId = partySS.getValue();
    if(!partyId){ toast('Please select a ' + partyLabel.toLowerCase(),'error'); return null; }

    /* Date */
    const dEl = document.querySelector('#content input[name="tx_date"]');
    const tEl = document.querySelector('#content input[name="tx_time"]');
    const dv = dEl ? dEl.value : '';
    const tv = (tEl && tEl.value ? tEl.value : '').trim();
    if(!dv){ toast('Pick a date','error'); return null; }
    if(isFuture(dv)){ toast('Future dates not allowed','error'); return null; }

    /* Stock check */
    const sc = checkStock(lines);
    if(!sc.ok){
      toast('Not enough stock: ' + sc.productName + ' — need ' + fmtNum(sc.need) + ' ' + sc.unit + ', have ' + fmtNum(sc.available), 'error');
      return null;
    }

    /* Totals */
    const disc = Number($('#ni-disc').value)||0;
    const paid = Number($('#ni-paid').value)||0;
    const notes = $('#ni-notes').value;
    const sub = lines.reduce((s,l)=>s+(Number(l.total)||0), 0);
    const gstOn = SETTINGS.gst_enabled && $('#ni-gst') && $('#ni-gst').checked;
    const gstRate = gstOn ? (Number(SETTINGS.gst_rate)||0) : 0;
    const afterDisc = Math.max(0, sub - disc);
    const gstAmt = gstOn ? (afterDisc * gstRate / 100) : 0;
    const total = afterDisc + gstAmt;
    const due = Math.max(0, total - paid);

    /* Insert invoice */
    const invData = {
      invoice_no: nextInvoiceNo(),
      party_id: partyId,
      party_type: partyType,
      subtotal: sub,
      discount: disc,
      total, paid, due, notes,
      invoice_date: dv,
      tx_time: tv,
      gst_enabled: gstOn,
      gst_rate: gstRate,
      gst_amount: gstAmt
    };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invData).select().single();
    if(invErr){ toast(invErr.message,'error'); return null; }

    /* Insert items */
    const itemRows = lines.map(l=>({
      invoice_id: inv.id,
      product_id: l.product_id,
      product_name: l.product_name,
      dual: l.dual||false,
      base_unit: l.base_unit||null,
      pack_unit: l.pack_unit||null,
      pack_size: l.pack_size||null,
      unit: l.unit||null,
      qty: l.qty,
      price: l.price,
      total: l.total
    }));
    const { error: itErr } = await sb.from('invoice_items').insert(itemRows);
    if(itErr){ toast('Items save failed: ' + itErr.message,'error'); return null; }

    /* Deduct stock safely */
    for(const l of lines){
      const ded = lineDeductBaseQty(l);
      const ok = await adjustStock(l.product_id, -ded);
      if(!ok) console.warn('Stock deduct failed for', l.product_name);
    }

    await syncDB();
    return inv;
  }

  $('#ni-save').onclick = async ()=>{
    const btn = $('#ni-save');
    btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save Invoice';
    if(inv){
      toast('Invoice saved','success');
      location.hash = '#/invoice/' + inv.id;
    }
  };

  $('#ni-save-print').onclick = async ()=>{
    const btn = $('#ni-save-print');
    btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save & Print';
    if(!inv) return;
    toast('Saved. Printing not configured yet.','info');
    location.hash = '#/invoice/' + inv.id;
  };
}
/* ============================================================
   PART 14 — INVOICES (list — view only + delete) & INVOICE VIEW

function renderInvoices(content){
  const list = DB.invoices;
  content.innerHTML = `
    <div class="page-head">
      <div><h1>All Invoices</h1><p>${list.length} invoices   farmers + retailers</p></div>
    </div>
    <div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div style="flex:2;min-width:220px"><label class="label">Search</label><input class="input" id="i-search" placeholder="Invoice no, party name..."></div>
      <div style="flex:1;min-width:140px"><label class="label">Type</label>
        <select class="input" id="i-type">
          <option value="">All types</option>
          <option value="farmer">Farmers only</option>

        </select>
      </div>

        <select class="input" id="i-sort">
          <option value="date-desc">Newest first</option>
          <option value="date">Oldest first</option>
          <option value="total-desc">Total (high)</option>
          <option value="due-desc">Due (high)</option>
        </select>
      </div>
      <div style="flex:0 0 auto"><label class="label">&nbsp;</label>
        <select class="input" id="i-filter">
          <option value="">All</option>
          <option value="due">Only with due</option>
          <option value="paid">Fully paid</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Invoice</th><th>Party</th><th>Type</th><th>Date</th><th style="text-align:right">Total</th><th style="text-align:right">Paid</th><th style="text-align:right">Due</th><th></th></tr></thead>
          <tbody id="i-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function getParty(inv){
    return inv.party_type === 'retailer'
      ? DB.retailers.find(x=>x.id===inv.party_id)
      : DB.farmers.find(x=>x.id===inv.party_id);
  }

  function filtered(){
    const q = ($('#i-search').value||'').toLowerCase().trim();
    const type = $('#i-type').value;
    const sortBy = $('#i-sort').value;
    const flt = $('#i-filter').value;
    let arr = list.filter(i=>{
      const p = getParty(i);
      const hay = ((i.invoice_no||'') + ' ' + (p?.name||'') + ' ' + (p?.phone||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(type && i.party_type !== type) return false;
      if(flt === 'due' && !(Number(i.due)>0)) return false;
      if(flt === 'paid' && Number(i.due)>0) return false;
      return true;
    });
    if(sortBy === 'date-desc') arr.sort((a,b)=>txDate(b,'invoice_date').localeCompare(txDate(a,'invoice_date')));
    else if(sortBy === 'date') arr.sort((a,b)=>txDate(a,'invoice_date').localeCompare(txDate(b,'invoice_date')));
    else if(sortBy === 'total-desc') arr.sort((a,b)=>Number(b.total)-Number(a.total));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>Number(b.due)-Number(a.due));
    return arr;
  }

  function renderTable(){
    const arr = filtered();
    $('#i-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-2)">No invoices match</td></tr>`
      : arr.map(i=>{
        const p = getParty(i);
        return `<tr>
          <td><a href="#/invoice/${i.id}" style="font-weight:600">${esc(i.invoice_no)}</a></td>
          <td>${esc(p?.name || '—')}</td>
          <td><span class="chip ${i.party_type==='retailer'?'chip-blue':'chip-green'}">${i.party_type==='retailer'?'Retailer':'Farmer'}</span></td>
          <td style="color:var(--text-2)">${txDT(i,'invoice_date')}</td>
          <td style="text-align:right">${rs(i.total)}</td>
          <td style="text-align:right;color:var(--green)">${rs(i.paid)}</td>
          <td style="text-align:right;color:${Number(i.due)>0?'var(--red)':'var(--text-2)'};font-weight:${Number(i.due)>0?'600':'400'}">${rs(i.due)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-ghost btn-sm" data-view="${i.id}">View</button>
            <button class="btn btn-ghost btn-sm" data-del="${i.id}" style="color:var(--red)">Del</button>
          </td>
        </tr>`;
      }).join('');
    $$('[data-view]').forEach(b=>b.onclick=()=> location.hash = '#/invoice/' + b.dataset.view);
    $$('[data-del]').forEach(b=>b.onclick=async()=>{
      const inv = DB.invoices.find(x=>x.id===b.dataset.del);
      if(!inv) return;
      const p = getParty(inv);
      if(!confirmDlg('Delete invoice ' + inv.invoice_no + ' of ' + rs(inv.total) + '?\n\nParty: ' + (p?.name||'—') + '\n\nStock will be restored.','Confirm Delete')) return;
      const items = DB.invoice_items.filter(x=>x.invoice_id===inv.id);
      /* Restore stock safely */
      for(const it of items){
        const back = lineDeductBaseQty(it);
        const ok = await adjustStock(it.product_id, back);
        if(!ok) console.warn('Stock restore failed for', it.product_name);
      }
      await sb.from('invoices').delete().eq('id', inv.id);
      await syncDB();
      toast('Invoice deleted — stock restored','success');
      renderTable();
    });
  }
  ['i-search','i-type','i-sort','i-filter'].forEach(id=>{ $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
}

function renderProducts(content){
  const list = DB.products;
  const categories = [...new Set(list.map(p=>p.category).filter(Boolean))].sort();
  const totalCostValue = list.reduce((s,p)=>s + (Number(p.stock)||0) * (Number(p.cost)||0), 0);

  content.innerHTML = `
    <div class="page-head">
      <div><h1>Products</h1><p>${list.length} SKUs   total stock value ${rs(totalCostValue)}</p></div>
      <div class="page-actions">
        <button class="btn btn-primary" id="add-prod">+ Add Product</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div style="flex:2;min-width:200px"><label class="label">Search</label><input class="input" id="p-search" placeholder="Name or category..."></div>
      <div style="flex:1;min-width:140px"><label class="label">Category</label>
        <select class="input" id="p-cat"><option value="">All</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      </div>
      <div style="flex:1;min-width:140px"><label class="label">Sort</label>
        <select class="input" id="p-sort">
          <option value="name">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="stock">Stock (low first)</option>
          <option value="stock-desc">Stock (high first)</option>
          <option value="value">Value (high)</option>
        </select>
      </div>
      <div style="flex:0 0 auto"><label class="label">&nbsp;</label>
        <select class="input" id="p-filter">
          <option value="">All</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Unit</th><th style="text-align:right">Cost</th><th style="text-align:right">Stock</th><th style="text-align:right">Value</th><th>Status</th><th></th></tr></thead>
          <tbody id="p-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function filtered(){
    const q = ($('#p-search').value||'').toLowerCase().trim();
    const cat = $('#p-cat').value;
    const sortBy = $('#p-sort').value;
    const flt = $('#p-filter').value;
    let arr = list.filter(p=>{
      const hay = (p.name + ' ' + (p.category||'') + ' ' + (p.unit||'') + ' ' + (p.base_unit||'') + ' ' + (p.pack_unit||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(cat && p.category !== cat) return false;
      if(flt === 'low' && !isLowStock(p)) return false;
      if(flt === 'out' && !isOutOfStock(p)) return false;
      return true;
    });
    if(sortBy === 'name') arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortBy === 'name-desc') arr.sort((a,b)=>b.name.localeCompare(a.name));
    else if(sortBy === 'stock') arr.sort((a,b)=>Number(a.stock)-Number(b.stock));
    else if(sortBy === 'stock-desc') arr.sort((a,b)=>Number(b.stock)-Number(a.stock));
    else if(sortBy === 'value') arr.sort((a,b)=>(Number(b.stock)*Number(b.cost))-(Number(a.stock)*Number(a.cost)));
    return arr;
  }

  function renderTable(){
    const arr = filtered();
    $('#p-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-2)">No products match</td></tr>`
      : arr.map(p=>{
        const d = productDisplay(p);
        const val = (Number(p.stock)||0) * (Number(p.cost)||0);
        const unitLabel = p.dual ? (p.primary_unit==='pack_unit'?p.pack_unit:p.base_unit) : p.unit;
        return `<tr>
          <td><strong>${esc(p.name)}</strong>${p.dual?' <span class="chip chip-blue" style="font-size:9px">DUAL</span>':''}</td>
          <td><span class="chip chip-gray">${esc(p.category||'—')}</span></td>
          <td style="color:var(--text-2);font-size:12px">${esc(unitLabel||'—')}</td>
          <td style="text-align:right">${rs(p.cost)}</td>
          <td style="text-align:right;font-weight:600">${esc(d.stockLabel)}</td>
          <td style="text-align:right;color:var(--text-2)">${rs(val)}</td>
          <td>${stockBadge(p)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-ghost btn-sm" data-restock="${p.id}">+ Stock</button>
            <button class="btn btn-ghost btn-sm" data-edit="${p.id}">Edit</button>
            <button class="btn btn-ghost btn-sm" data-del="${p.id}" style="color:var(--red)">Del</button>
          </td>
        </tr>`;
      }).join('');
    $$('[data-restock]').forEach(b=>b.onclick=()=>openRestockForm(b.dataset.restock));
    $$('[data-edit]').forEach(b=>b.onclick=()=>openProductForm(DB.products.find(x=>x.id===b.dataset.edit)));
    $$('[data-del]').forEach(b=>b.onclick=async()=>{
      const p = DB.products.find(x=>x.id===b.dataset.del);
      if(!confirmDlg('Delete "' + (p?.name||'') + '"?','Confirm Delete')) return;
      await sb.from('products').delete().eq('id', b.dataset.del);
      await syncDB(); toast('Deleted','success'); renderTable();
    });
  }

  ['p-search','p-cat','p-sort','p-filter'].forEach(id=>{ $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
  $('#add-prod').onclick = ()=> openProductForm();
}

function openProductForm(existing, prefill, onCreated){
  const base = existing || {
    name:'', category:'', dual:false, unit:'kg',
    base_unit:'kg', pack_unit:'bag', pack_size:50,
    cost:0, stock:0, low_stock_alert:5, primary_unit:'base_unit'
  };
  const p = prefill ? Object.assign({}, base, prefill) : base;
  const catOptions = PRODUCT_CATS.map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${c}</option>`).join('');

  openModal(`
    <h2 style="font-size:16px;font-weight:600;margin-bottom:14px">${existing?'Edit Product':'New Product'}</h2>
    <form id="prf" style="display:flex;flex-direction:column;gap:12px">
      <div><label class="label">Name *</label><input class="input" name="name" required value="${esc(p.name)}" autofocus></div>
      <div class="grid-2">
        <div><label class="label">Category</label>
          <select class="input" name="category"><option value="">— Select —</option>${catOptions}</select>
        </div>
        <div><label class="label">Dual Unit?</label>
          <select class="input" name="dual">
            <option value="no" ${!p.dual?'selected':''}>No — single unit</option>
            <option value="yes" ${p.dual?'selected':''}>Yes — loose + pack</option>
          </select>
        </div>
      </div>

      <div id="single-block" style="display:${p.dual?'none':'block'}">
        <div class="grid-2">
          <div><label class="label">Unit</label>
            <select class="input" name="unit">${BASE_UNITS.concat(PACK_UNITS).filter((v,i,a)=>a.indexOf(v)===i).map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select>
          </div>
          <div><label class="label">Cost price / unit (₹)</label><input class="input" type="number" step="any" min="0" name="cost1" value="${p.cost||0}"></div>
          <div><label class="label">Stock</label><input class="input" type="number" step="any" min="0" name="stock1" value="${p.stock||0}"></div>
          <div><label class="label">Low alert at</label><input class="input" type="number" step="any" min="0" name="low1" value="${p.low_stock_alert||5}"></div>
        </div>
      </div>

      <div id="dual-block" style="display:${p.dual?'block':'none'}">
        <div class="grid-2">
          <div><label class="label">Base unit</label>
            <select class="input" name="base_unit">${BASE_UNITS.map(u=>`<option ${p.base_unit===u?'selected':''}>${u}</option>`).join('')}</select>
          </div>
          <div><label class="label">Pack unit</label>
            <select class="input" name="pack_unit">${PACK_UNITS.map(u=>`<option ${p.pack_unit===u?'selected':''}>${u}</option>`).join('')}</select>
          </div>
        </div>
        <div style="margin-top:10px">
          <label class="label">1 <span class="pk-lbl">${p.pack_unit}</span> = <input class="input" type="number" step="any" min="0.01" name="pack_size" value="${p.pack_size||50}" style="display:inline-block;width:100px;margin:0 6px"> <span class="bs-lbl">${p.base_unit}</span></label>
        </div>
        <div class="grid-2" style="margin-top:10px">
          <div><label class="label">Cost / base unit (₹)</label><input class="input" type="number" step="any" min="0" name="cost_base" id="cost_base_input" value="${p.cost||0}"></div>
          <div><label class="label">Cost / pack (₹) — auto syncs</label><input class="input" type="number" step="any" min="0" name="cost_pack" id="cost_pack_input" value="${(p.cost>0 && p.pack_size>0) ? (p.cost*p.pack_size).toFixed(2) : 0}"></div>
          <div><label class="label">Stock (base unit)</label><input class="input" type="number" step="any" min="0" name="stock2" value="${p.stock||0}"></div>
          <div><label class="label">Low alert (base)</label><input class="input" type="number" step="any" min="0" name="low2" value="${p.low_stock_alert||5}"></div>
        </div>
        <div style="margin-top:10px">
          <label class="label">Primary display</label>
          <select class="input" name="primary_unit">
            <option value="base_unit" ${p.primary_unit==='base_unit'?'selected':''}>Base unit first</option>
            <option value="pack_unit" ${p.primary_unit==='pack_unit'?'selected':''}>Pack unit first</option>
          </select>
        </div>
      </div>

      <p class="field-hint">💡 No selling price stored — you'll enter it manually on every invoice.</p>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="prf-save">${existing?'Update':'Save'}</button>
      </div>
    </form>
  `, root => {
    const dualSel = root.querySelector('[name="dual"]');
    const singleB = root.querySelector('#single-block');
    const dualB = root.querySelector('#dual-block');
    dualSel.onchange = ()=>{
      const isDual = dualSel.value === 'yes';
      singleB.style.display = isDual?'none':'block';
      dualB.style.display = isDual?'block':'none';
    };

    const bu = root.querySelector('[name="base_unit"]');
    const pu = root.querySelector('[name="pack_unit"]');
    const upLbls = ()=>{
      root.querySelectorAll('.pk-lbl').forEach(e=>e.textContent = pu.value);
      root.querySelectorAll('.bs-lbl').forEach(e=>e.textContent = bu.value);
    };
    if(bu){ bu.onchange = upLbls; pu.onchange = upLbls; upLbls(); }

    const cb = root.querySelector('#cost_base_input');
    const cp = root.querySelector('#cost_pack_input');
    const ps = root.querySelector('[name="pack_size"]');
    if(cb && cp && ps){
      const sync = ()=>{
        const size = Number(ps.value)||1;
        if(document.activeElement === cp) cb.value = (Number(cp.value)/size).toFixed(4);
        else if(document.activeElement === cb) cp.value = ((Number(cb.value)||0)*size).toFixed(2);
      };
      cp.addEventListener('input', sync);
      cb.addEventListener('input', sync);
      ps.addEventListener('input', sync);
    }

    root.querySelector('#prf').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const isDual = fd.get('dual') === 'yes';
      const name = (fd.get('name')||'').trim();
      if(!name){ toast('Enter product name','error'); return; }

      let data;
      if(isDual){
        const packSize = Number(fd.get('pack_size'))||1;
        const costPack = Number(fd.get('cost_pack'))||0;
        const costBase = Number(fd.get('cost_base'))||0;
        const finalCostBase = costPack > 0 ? (costPack / packSize) : costBase;
        data = {
          name, category: fd.get('category')||'', dual:true,
          base_unit: fd.get('base_unit'),
          pack_unit: fd.get('pack_unit'),
          pack_size: packSize,
          cost: Math.round(finalCostBase * 10000)/10000,
          stock: Number(fd.get('stock2'))||0,
          low_stock_alert: Number(fd.get('low2'))||0,
          primary_unit: fd.get('primary_unit')||'base_unit',
          unit:null
        };
      } else {
        data = {
          name, category: fd.get('category')||'', dual:false,
          unit: fd.get('unit'),
          cost: Number(fd.get('cost1'))||0,
          stock: Number(fd.get('stock1'))||0,
          low_stock_alert: Number(fd.get('low1'))||0,
          base_unit:null, pack_unit:null, pack_size:null,
          primary_unit:'base_unit'
        };
      }

      const btn = root.querySelector('#prf-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      let res;
      if(existing) res = await sb.from('products').update(data).eq('id', existing.id).select().single();
      else res = await sb.from('products').insert(data).select().single();
      if(res.error){
        toast(res.error.message,'error');
        btn.disabled = false; btn.textContent = existing?'Update':'Save';
        return;
      }
      await syncDB();
      toast(existing?'Updated':'Added','success');
      closeModal(root);
      if(onCreated) onCreated(res.data);
      else route();
    };
  });
}

function openRestockForm(pId){
  const p = DB.products.find(x=>x.id===pId);
  if(!p) return;
  const isDual = p.dual;
  const baseUnit = isDual ? p.base_unit : p.unit;
  const packUnit = isDual ? p.pack_unit : '';
  const packSize = isDual ? Number(p.pack_size)||1 : 1;
  const currentDisplay = isDual
    ? `${fmtNum(p.stock)} ${baseUnit} (${fmtNum(Number(p.stock)/packSize)} ${packUnit})`
    : `${fmtNum(p.stock)} ${p.unit}`;

  openModal(`
    <h2 style="font-size:16px;font-weight:600;margin-bottom:8px">Restock: ${esc(p.name)}</h2>
    <div style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px">
      Current stock: <b>${currentDisplay}</b>
    </div>
    <form id="restock-form" style="display:flex;flex-direction:column;gap:12px">
      ${isDual?`<div><label class="label">Adding by</label>

          <option value="base">${baseUnit}</option>
        </select>

        <button class="btn btn-primary" id="restock-save">Add Stock</button>

      e.preventDefault();
      const fd = new FormData(e.target);

      const addType = isDual ? fd.get('add_type') : 'base';

    toast('Bill deleted, stock reversed','success');
    route();

  /* Delete supplier payment */
  $$('[data-spay-del]').forEach(b=>b.onclick=async()=>{

    await sb.from('supplier_payments').delete().eq('id', b.dataset.spayDel);
    await syncDB();
    toast('Deleted','success');
    route();
  });
}

function renderPurchases(content){
  const list = DB.supplier_invoices;
  content.innerHTML = `
    <div class="page-head">
      <div><h1>Purchases</h1><p>${list.length} purchase bills   ${DB.suppliers.length} companies</p></div>
    </div>
    <div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div style="flex:2;min-width:220px"><label class="label">Search</label><input class="input" id="pu-search" placeholder="Bill no or company..."></div>
      <div style="flex:1;min-width:140px"><label class="label">Sort</label>
        <select class="input" id="pu-sort">
          <option value="date-desc">Newest first</option>
          <option value="date">Oldest first</option>
          <option value="due-desc">Balance (high)</option>
        </select>
      </div>
      <div style="flex:0 0 auto"><label class="label">&nbsp;</label>
        <select class="input" id="pu-filter">
          <option value="">All</option>
          <option value="due">Only with balance</option>
          <option value="paid">Fully paid</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Bill No</th><th>Company</th><th>Date</th><th style="text-align:right">Total</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th><th></th></tr></thead>
          <tbody id="pu-body"></tbody>
        </table>
      </div>
    </div>
  `;

  function filtered(){
    const q = ($('#pu-search').value||'').toLowerCase().trim();
    const sortBy = $('#pu-sort').value;
    const flt = $('#pu-filter').value;
    let arr = list.filter(b=>{
      const sup = DB.suppliers.find(s=>s.id===b.supplier_id);
      const hay = ((b.bill_no||'') + ' ' + (sup?.name||'')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      const bal = Number(b.total) - Number(b.paid);
      if(flt === 'due' && bal <= 0) return false;
      if(flt === 'paid' && bal > 0) return false;
      return true;
    });
    if(sortBy === 'date-desc') arr.sort((a,b)=>txDate(b,'bill_date').localeCompare(txDate(a,'bill_date')));
    else if(sortBy === 'date') arr.sort((a,b)=>txDate(a,'bill_date').localeCompare(txDate(b,'bill_date')));
    else if(sortBy === 'due-desc') arr.sort((a,b)=>(Number(b.total)-Number(b.paid))-(Number(a.total)-Number(a.paid)));
    return arr;
  }

  function renderTable(){
    const arr = filtered();
    $('#pu-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-2)">No purchases yet</td></tr>`
      : arr.map(b=>{
        const sup = DB.suppliers.find(s=>s.id===b.supplier_id);
        const bal = Number(b.total) - Number(b.paid);
        return `<tr>
          <td><strong>${esc(b.bill_no||'—')}</strong></td>
          <td><a href="#/company/${b.supplier_id}" style="font-weight:600">${esc(sup?.name||'—')}</a></td>
          <td style="color:var(--text-2)">${txDT(b,'bill_date')}</td>
          <td style="text-align:right">${rs(b.total)}</td>
          <td style="text-align:right;color:var(--green)">${rs(b.paid)}</td>
          <td style="text-align:right;font-weight:${bal>0?'600':'400'};color:${bal>0?'var(--red)':'var(--text-2)'}">${rs(bal)}</td>
          <td style="text-align:right"><a href="#/company/${b.supplier_id}" class="btn btn-ghost btn-sm">View</a></td>
        </tr>`;
      }).join('');
  }

  ['pu-search','pu-sort','pu-filter'].forEach(id=>{ $('#'+id).oninput = renderTable; $('#'+id).onchange = renderTable; });
  renderTable();
}
